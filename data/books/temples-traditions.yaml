title: Temples & Traditions
year: 2026
invitation: >-
  A devta is not a symbol here. It is an institution with a name, an office,
  and a door you enter as a guest.
thesis: >-
  These are not monuments. They are houses the village still answers to.
region: himachal
description: >-
  A book of Himachal's living temple culture — the devtas, the office-holders
  around them, the etiquette of visiting, and the sacred places already in
  this library. Cultural and historical claims here are hedged where they
  are not yet confirmed by a named local source, per this site's own
  verification standard; nothing is stated as settled fact until it is.
priority: p1
bookType: primary
seoTitle: "Himachal Temples & Devta Culture — Pahari Yatri"
metaDescription: >-
  Himachal's devta temples, etiquette, and living culture — Kamrunag,
  Shikari Devi, Churdhar, Parashar, and how to visit any of them as a guest,
  not an audience.
cta: yatri-circle
excerpt: >-
  The sacred grammar of the Himalayas: devtas, temple etiquette, and the
  places where the old order still holds. Read before you visit, not after.
