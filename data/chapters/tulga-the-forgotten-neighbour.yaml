authorType: editorial
invitation: Between two famous names sits a third village almost nobody mentions.
excerpt: >-
  Tulga sits between Kalga and Pulga, sharing their geography without
  sharing their fame. This chapter says plainly what is known and what
  is not, rather than inventing a history to fill the gap.
