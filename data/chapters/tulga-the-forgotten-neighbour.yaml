localTruth: >-
  This chapter is deliberately short. Independent, detailed research
  on Tulga's own history, population, or daily life was not found
  during this session, beyond its position between Kalga and Pulga and
  its foot-only access from Barshaini. Rather than pad that gap with
  invented texture, this chapter states plainly what is known and
  flags the rest as unresearched.
sources:
  - label: MakeMyTrip Trip Ideas, Kalga, Pulga and Tulga villages
    url: https://www.makemytrip.com/tripideas/attractions/kalga-pulga-and-tulga-villages
overview: >-
  Tulga is a small, secluded village positioned between Kalga and
  Pulga in the Parvati valley, reached only on foot from the Barshaini
  roadhead, with no separate road or vehicle access of its own. Beyond
  its geography and its position as the quieter third village in a
  trio usually discussed together, detailed independent information on
  Tulga's own population, history, or economy was not found in the
  research behind this chapter. That gap is stated here honestly rather
  than filled with generic village description borrowed from its more
  documented neighbours.
distance: reached on foot from Barshaini, between Kalga and Pulga
bestTime: April to June and September to November, matching the wider valley pattern
gettingThere: >-
  Follow the same foot route used to reach Kalga and Pulga from
  Barshaini; Tulga sits between the two, without a separately
  documented approach of its own in the sources available for this
  chapter.
faqs:
  - question: Why is there so little written about Tulga?
    answer: >-
      Most coverage of this trio of villages focuses on Kalga and
      Pulga, which have larger, more established homestay and cafe
      scenes. Tulga is mentioned mainly as the third, quieter village
      between them rather than researched in its own right by the
      sources available to this chapter.
  - question: Should I visit Tulga specifically?
    answer: >-
      If you are already walking between Kalga and Pulga, there is no
      reason to skip it. This chapter cannot yet tell you what makes a
      dedicated visit to Tulga alone worthwhile, because that research
      has not been done to this library's standard yet.
narrative: >-
  Every valley seems to have a village like Tulga, the one caught
  between two better-known names, mentioned in passing more often than
  visited on purpose.

  This chapter will not pretend to know more about Tulga than the
  research supports. What can be said honestly: it sits on the same
  foot path that connects Kalga and Pulga, sharing their remoteness
  without sharing their homestay economy or their write-ups.

  Local truth: an empty page is more honest than an invented one. Tulga
  will get a fuller chapter once genuine, sourced research exists to
  support it, not before.
closingQuote: >-
  Some places wait to be understood rather than photographed. This one still is.
