overview: >-
  Bashleo Pass (about 3,600 m / 11,800 ft) is the old walking road between the
  Tirthan valley at Bathad and the Sutlej-side villages around Baga Sarahan in
  outer Seraj. Shepherds, traders and wedding parties crossed it for centuries
  before the motor roads went around; the path still carries flocks every
  summer.

  The trek skirts the Great Himalayan National Park's buffer forests: brown
  oak, blue pine, pheasant calls at dawn. It is a quiet, honest
  two-to-three-day crossing through living villages rather than wilderness
  theatre, and one of the best ways to feel how Seraj actually connects.
duration: 2–3 Days
distance: ~22 km, Bathad to Baga Sarahan
maxAltitude: ~3,600 m / 11,800 ft
difficulty: Moderate
bestTime: May–June and September–October
gettingThere: >-
  Start: Bathad in the Tirthan valley, reached via Aut and Banjar. Finish:
  Baga Sarahan, connected by road down to Arsu and the Sutlej highway toward
  Rampur. Walk it either direction; starting in Tirthan keeps the steepest
  climb for fresh legs.
itinerary:
  - day: Day 1
    title: Bathad · forest camp below the pass
    detail: >-
      Climb from the village up long forest switchbacks to the thatch meadows
      below Bashleo, 5–6 hours. Shepherd huts and spring water at camp.
  - day: Day 2
    title: Bashleo Pass · Baga Sarahan
    detail: >-
      An hour to the pass gate and its small shrine, then descend meadows and
      oak forest into Baga Sarahan's fields by afternoon.
faqs:
  - question: Do I need permits?
    answer: >-
      The pass route itself lies in the park's buffer; no special permit is
      needed for this crossing. Entering the GHNP core on side trails does
      require park permits, so stay on the through-path unless arranged.
