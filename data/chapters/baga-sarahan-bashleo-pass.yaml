title: Baga Sarahan + Bashleo Pass Peak Trek
invitation: Meadow to pass—a bright grammar of effort and reward.
excerpt: >-
  Shepherd country and a summit with a clear reply. We walk steady and the day
  agrees.
location: Seraj Valley
image: /static/images/chapters/baga-sarahan-bashleo-pass/image.avif
relatedStories:
  - bashleo-clear-reply
giftsFromMountains:
  - Strength
  - Gratitude
themes:
  - Pasture
