localTruth: >-
  Grahan's alcohol ban is real and consistently enforced, reported
  independently across multiple sources including traveller forum
  discussions, not just marketing copy: signboards mark it, fines
  penalise it, and the community holds to it as a matter of shared
  practice. Its origin, however, is local tradition, not government
  law, villagers describe it as a decree tied to the local deity Yagya
  Maharishi rather than a state regulation. This chapter states the
  enforced rule as fact and the deity origin story as what it is, a
  tradition the village itself tells, and declines the "only village in
  India" superlative some sites attach to it, since that specific claim
  was not independently confirmed.
