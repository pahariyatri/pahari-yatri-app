title: Kasol Weekend Trail
invitation: A soft walk through cafes and cedars—gentle and bright.
excerpt: >-
  Short days by the river, small bridges of conversation, and a trail that asks
  for nothing more than presence.
location: Kasol
image: /static/images/chapters/kasol-weekend/image.jpg
