localTruth: >-
  Sar Pass is widely described as a good first high-altitude trek for
  reasonably fit beginners, but the honest local truth sits inside that
  description: the final stretch from Nagaru to the pass and on to
  Biskeri is consistently flagged by trek operators as the genuinely
  difficult section, steep, high, and unforgiving of poor preparation.
  Treat the "beginner friendly" label as true overall and incomplete on
  its own.
