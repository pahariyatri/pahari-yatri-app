overview: >-
  In Seraj, rain is a relationship, negotiated with the local devtas at
  shrines that stand where paths cross. This monsoon chapter visits that
  living weather-faith: temple courtyards under dripping deodar around Banjar
  and Chaini, the drum language that calls a village to its god, and the
  etiquette of entering (or respectfully not entering) shrine ground.

  Monsoon is the Himalaya's least-marketed and most intimate season. Trails
  are short and green beyond description; leeches and landslips are real; and
  every walk ends under a roof with tea, listening to the rain being answered.
duration: 2–3 days
distance: 2–6 km per walk
difficulty: Gentle, with monsoon care
bestTime: July–September
gettingThere: >-
  Aut, then Banjar as the base. The shrine walks radiate on village paths:
  Shringa Rishi's temple and Chaini tower, the courtyards above Banjar bazaar,
  and whichever shrine your homestay family actually keeps, which is the real
  syllabus. Check road and slope conditions daily in monsoon.
itinerary:
  - day: Movement I
    title: Shringa Rishi and the tower
    detail: >-
      The stone path from Bagi to Chaini Kothi and the valley's presiding
      deity. Shoes off, cameras asked-first, shoulders covered.
  - day: Movement II
    title: A village's own shrine
    detail: >-
      Whichever devta your hosts keep: go with them, carry nothing but
      attention, and let them show you where to stand.
faqs:
  - question: Are outsiders allowed inside the temples?
    answer: >-
      Rules differ shrine to shrine; some sanctums are closed to outsiders and
      some to everyone but the pujari. Ask first, accept the answer without
      negotiation, and the courtyard welcome that follows is warm everywhere.
  - question: Is monsoon travel in Seraj safe?
    answer: >-
      The rain is gentle on walkers and hard on roads: landslips close bends
      for hours, so keep plans short and check conditions each morning. Walk
      near your base, and let the weather set the syllabus.
  - question: Can I attend a village ritual?
    answer: >-
      Only by invitation, and invitations come to guests who wait well. Stay
      with a family, show unhurried respect at their shrine, and if the drums
      start while you are there, follow your hosts and stand where they place
      you.
narrative: >-
  In Seraj, rain is not a forecast. It is a relationship, and it has a temper,
  and there are protocols.

  We came in monsoon, which everyone advises against and which I now advise.
  The valley was drowned green, paths steaming, every leaf fat with water. In
  Banjar bazaar, drums started one afternoon, deep and patterned, and our
  homestay's son said simply: the devta is being asked about the weather.

  We climbed the stone path to Shringa Rishi's temple in a gap between
  showers. Shoes off, shoulders covered, camera asked about first, the answer
  was no for the sanctum and yes for the courtyard, delivered kindly, and
  holding to it felt better than any photograph would have.

  The tower of Chehni above us wore cloud like a scarf. Under the eaves, an
  old priest told us the valley's gods control rain, hail, harvest, everything
  with a temper, and are consulted like living administrators, because they
  are.

  That evening the family's own shrine got a small offering before dinner,
  quick and unceremonial, the way you might knock on a door before entering.
  Belief here is not an event. It is table manners with the universe.

  Local truth: every village in Seraj has its devta and its rules, different
  from the next village's. Never assume yesterday's etiquette travels. Ask, at
  each threshold, every time.

  July to September. Short walks, long teas, waterproof everything, and check
  the road conditions daily. Leeches are real; so is the green.

  I went to see how mountains ask for rain. I left wondering when I had
  stopped asking for anything properly.
closingQuote: >-
  The valley does not pray for rain. It stays in touch with it.
