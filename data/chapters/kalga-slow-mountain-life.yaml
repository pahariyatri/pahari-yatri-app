localTruth: >-
  Sources disagree on Kalga's exact altitude by roughly 200 metres,
  depending on where the measurement was taken along the village's
  sloped layout. What every account agrees on: there is no road, only a
  30 to 45 minute uphill walk from Barshaini, and the village's roughly
  40 to 50 houses are built the old way, stone and wood, with animals
  kept on the ground floor and people above them, a practical answer to a
  cold climate rather than a design choice made for visitors.
