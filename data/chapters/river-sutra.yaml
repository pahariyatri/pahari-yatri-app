overview: >-
  The Tirthan is the slow thread of this library: a trout-clear river that has
  never been dammed, running from GHNP snow to the Beas at Larji. This chapter
  follows it as a sutra, a line to walk and re-walk: village to village on the
  true right bank, pools where you sit rather than swim, and evenings when the
  river does all the talking.

  Nothing here is far and nothing is steep for long. The discipline is staying
  beside one river long enough for it to become particular: this rock, this
  bend, this dipper bobbing on this log.
duration: 2–3 days
distance: 3–8 km per walk
difficulty: Gentle
bestTime: March–June and September–November; the river runs loud and brown in monsoon
gettingThere: >-
  Aut, then the Tirthan road to Gushaini or Nagini (about an hour). Stay in
  one riverside homestay for the whole chapter; moving daily defeats it. The
  walks link Gushaini's bridge, the ecozone path upstream, and the bank lanes
  downstream toward Sai Ropa.
itinerary:
  - day: Movement I
    title: Upstream to the park gate
    detail: >-
      The riverside path from Gushaini toward the GHNP entrance: an easy
      out-and-back that touches wilderness without paperwork.
  - day: Movement II
    title: Bank lanes and pools
    detail: >-
      Downstream village walking with long sits at two or three pools. Bring a
      book you end up not reading.
faqs:
  - question: Can I fish here?
    answer: >-
      The Tirthan is angling country (brown trout, catch-and-release culture)
      with permits issued locally; many Yatris prefer to watch. Never fish
      near temple pools, and ask your homestay before anything.
  - question: Can I swim in the Tirthan?
    answer: >-
      The river is snow-cold and faster than it looks; locals wade the calm
      autumn pools and no more. Ask your hosts which pools are safe and which
      belong to temples, and never leave soap or noise at the water.
  - question: What does catch-and-release mean here?
    answer: >-
      Anglers hook the brown trout for the conversation, photograph nothing
      but the memory, and return the fish to its seam. Permits are issued
      locally; many Yatris find that watching the water is the better sport.
narrative: >-
  I spent three days beside one river and it was somehow not boring for a
  single minute, which tells you either about the river or about how I had
  been living.

  The Tirthan is trout-clear and undammed, one of the last rivers in Himachal
  that still owns its whole voice from source to mouth. Our homestay's veranda
  hung over a pool, and the river ran all night like a sentence with no full
  stop, and we slept inside its grammar.

  The days had a shape. Morning: the ecozone path upstream toward the park
  gate, dippers bobbing on wet stones, the water so clear the fish looked like
  they were flying. Noon: a pool, a rock, bread and local honey, the serious
  work of sitting. Evening: downstream through the village lanes, saying
  namaste to the same three grandfathers, our stock rising visibly each day.

  Our host, a fishing guide, showed us how to read water, the seams where
  current and calm negotiate, where trout hold like commas. He releases almost
  everything he catches. "The river is the account," he said. "Fish are the
  interest."

  Local truth: this valley fought off a hydro project years ago and knows
  exactly what its river is worth. Respect that pride: no soap in the water,
  no loud music on the banks, no shortcuts through the trout pools.

  March to June, September to November. Stay in one place; moving daily breaks
  the spell that staying builds.

  On the last evening I realised I had stopped narrating my life to myself.
  The river had taken over the commentary, and it was better at it.
closingQuote: >-
  Sit by moving water long enough and your thoughts learn its manners.
