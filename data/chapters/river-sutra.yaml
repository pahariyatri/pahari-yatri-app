title: River Sutra
trackType: cultural
parentBook: summer
invitation: Let the river speak. Walk beside its sentence until it ends.
excerpt: >-
  A bendwise chapter along sunlit water. Stones as commas, dragonflies as
  italics, and your shadow reading aloud.
