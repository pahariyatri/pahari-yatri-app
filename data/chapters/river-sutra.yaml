title: River Sutra
invitation: Let the river speak. Walk beside its sentence until it ends.
excerpt: >-
  A bendwise chapter along sunlit water. Stones as commas, dragonflies as
  italics, and your shadow reading aloud.
location: Tirthan valley
image: /static/images/chapters/river-sutra/image.jpg
relatedStories:
  - river-hymn
giftsFromMountains:
  - Flow
  - Clarity
themes:
  - Water
  - Movement
overview: >-
  The Tirthan is the slow thread of this library: a trout-clear river that has
  never been dammed, running from GHNP snow to the Beas at Larji. This chapter
  follows it as a sutra, a line to walk and re-walk: village to village on the
  true right bank, pools where you sit rather than swim, and evenings when the
  river does all the talking.

  Nothing here is far and nothing is steep for long. The discipline is staying
  beside one river long enough for it to become particular: this rock, this
  bend, this dipper bobbing on this log.
duration: 2–3 days
distance: 3–8 km per walk
difficulty: Gentle
bestTime: March–June and September–November; the river runs loud and brown in monsoon
gettingThere: >-
  Aut, then the Tirthan road to Gushaini or Nagini (about an hour). Stay in
  one riverside homestay for the whole chapter; moving daily defeats it. The
  walks link Gushaini's bridge, the ecozone path upstream, and the bank lanes
  downstream toward Sai Ropa.
itinerary:
  - day: Movement I
    title: Upstream to the park gate
    detail: >-
      The riverside path from Gushaini toward the GHNP entrance: an easy
      out-and-back that touches wilderness without paperwork.
  - day: Movement II
    title: Bank lanes and pools
    detail: >-
      Downstream village walking with long sits at two or three pools. Bring a
      book you end up not reading.
faqs:
  - question: Can I fish here?
    answer: >-
      The Tirthan is angling country (brown trout, catch-and-release culture)
      with permits issued locally; many Yatris prefer to watch. Never fish
      near temple pools, and ask your homestay before anything.
