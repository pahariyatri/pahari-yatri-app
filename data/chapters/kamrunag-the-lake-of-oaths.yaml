overview: >-
  Kamrunag Lake rests at about 3,334 m (10,938 ft) in the Mandi district of
  Himachal Pradesh, hidden in dense deodar forest below the Kamrunag ridge.
  The lake belongs to Dev Kamrunag, the rain god of Mandi, and for centuries
  pilgrims have offered coins and even gold into its dark water. Nothing is
  ever taken out; the lake is the god's treasury, and the mountain keeps his
  accounts.

  The walk to the lake is short but steadily uphill, through one of the finest
  deodar stands in the district. Every June, during the Saranahuli fair,
  thousands climb this path with drums and deities on palanquins. The rest of
  the year it is quiet enough to hear your own promises. This chapter suits
  any reasonably fit walker who wants a true living-culture pilgrimage rather
  than a summit.
duration: 1–2 Days
distance: ~6 km one way from Rohanda (round trip ~12 km)
maxAltitude: 3,334 m / 10,938 ft
difficulty: Easy to Moderate
bestTime: May–June (Saranahuli fair, mid-June) and September–November
gettingThere: >-
  Nearest airport: Bhuntar (Kullu). Nearest broad-gauge railhead:
  Kiratpur/Chandigarh side; Joginder Nagar on the narrow gauge. Reach Mandi
  town first, then drive about 45 km on the Mandi–Karsog road to Rohanda, the
  usual trailhead.

  From Rohanda the stone path climbs about 6 km through deodar forest to the
  lake and temple. Walk slowly: locals climb this with deities on their
  shoulders, and the etiquette of the path matters more than your pace.
itinerary:
  - day: Day 1
    title: Mandi · Rohanda · climb to Kamrunag
    detail: >-
      Drive from Mandi to Rohanda and begin the forest climb, about 3–4 hours
      up. Reach the lake, sit with the temple, and watch what pilgrims do
      before you do anything. Descend the same day, or stay nearby if
      arrangements allow.
  - day: Day 2
    title: Morning by the lake · descend
    detail: >-
      If you stayed up, give the early morning to the water: mist, bells, and
      the ridge walking out of cloud. Descend to Rohanda by midday and return
      to Mandi.
faqs:
  - question: Can I take a coin or anything from the lake?
    answer: >-
      No. Everything offered to Kamrunag stays with Kamrunag. Taking anything
      from the lake or its bed is deeply offensive here, and local belief
      holds that it never ends well for the taker.
  - question: When is the Saranahuli fair?
    answer: >-
      Around mid-June each year, when deities from surrounding valleys are
      carried up on foot. It is crowded, loud, and extraordinary. If you want
      silence instead, come in autumn.
