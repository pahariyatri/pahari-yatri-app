title: Kamrunag – The Lake of Oaths
invitation: Promise gently; water remembers more than we do.
excerpt: >-
  A winter chapter at a high, frozen lake where vows have a weight. The
  silence feels like a keeper.
location: Kamrunag, Mandi
image: /static/images/chapters/kamrunag-the-lake-of-oaths/image.jpg
relatedStories:
  - mirror-of-stillness
giftsFromMountains:
  - Stillness
