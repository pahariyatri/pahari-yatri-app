overview: >-
  Kamrunag is a small dark lake and a pent-roof wooden temple on a forested
  ridge in Mandi district, Himachal Pradesh. The Mandi district
  administration's tourism page places it at 3,334 m and describes the temple
  of Dev Kamrunag standing beside the water inside thick deodar forest, with
  the Dhauladhar range on one horizon and the Balh valley falling away on the
  other. A field botanist writing in Hill Post in 2023 recorded a GPS altitude
  of about 2,900 m at the lake, so the two figures do not agree. We use the
  official district figure here and flag the difference rather than quietly
  choosing one.

  What makes Kamrunag unusual is not its height. It is what lies at the bottom
  of the water. The district page records a tradition of devotees offering
  gold, silver and coins to the lake when a wish is fulfilled by Dev Kamrunag,
  and states plainly that the quantity resting on the lake bed cannot be
  estimated. The Times of India, reporting from the June fair in 2015,
  described the same practice from the ground: offerings gathered over the
  three days of the fair are immersed in the lake rather than banked, a
  practice the report said has been followed for centuries, and devotees
  quoted there said they had never heard of a theft at the lake.

  The deity is central to this district, not local colour. Hindustan Times
  refers to the temple's deity as Bada Deo Kamrunag and calls him the
  principal deity of the region. The Hill Post account gives the local names
  Lord of Rain and Bada Baba, describes an old stone idol of Dev Kamru Nag
  near the lake, and notes that the deity also takes part in the week-long
  International Shivratri fair held at Mandi each March. The Mandi district
  page separately records a tradition that Kamrunag is the King Yaksha of the
  Mahabharata, worshipped by the Pandavas. Pahari Yatri has not yet confirmed
  that lineage with the temple's own kardaars, so we carry it as recorded
  tradition, not as settled fact.

  Most visitors still start from Rohanda. The district page gives the walk as
  roughly 6 km of steep mountain path taking three to four hours, with Rohanda
  47 km from Mandi town and 35 km from Sundernagar. The Times of India report
  describes an incline of about 8 km from a Rohanda around 60 km from Mandi,
  so treat the distance as approximate. Since a 16 km road was completed from
  Shala panchayat to the edge of the temple premises, reported by The Tribune,
  vehicles reach far closer than they once did, and the shape of a visit here
  has changed with it.

  Mid-June, during the Saranahuli fair, is the loudest and most alive the
  ridge ever gets. Autumn is the quiet opposite. Hindustan Times notes that
  the lake freezes in winter, and snow usually shuts the upper forest from
  roughly December to March. This chapter is for anyone who wants to
  understand the place before standing at that water, rather than after.
distance: >-
  ~6 km one way on foot from Rohanda (round trip ~12 km) per the Mandi
  district tourism page; some reports describe the incline as ~8 km
maxAltitude: >-
  3,334 m / 10,938 ft per the Mandi district administration; a 2023 field GPS
  reading published in Hill Post records ~2,900 m
bestTime: >-
  Mid-June for the Saranahuli fair; September to November for quiet. Snow
  usually closes the upper forest from December to March, and Hindustan Times
  notes the lake freezes in winter.
gettingThere: >-
  Nearest airport: Bhuntar (Kullu). Nearest broad-gauge railhead: Chandigarh;
  Joginder Nagar on the narrow gauge. Reach Mandi town first. From Mandi it is
  about 47 km by road to Rohanda, the usual trailhead, or about 35 km from
  Sundernagar, per the district tourism page.

  From Rohanda the path climbs roughly 6 km through forest to the lake and
  temple, three to four hours at an unhurried pace on the district's own
  reckoning. Start early. Most people who walk up go back down the same day.
  We have not found established visitor accommodation at the lake itself, so
  plan your descent before you plan your photographs, and ask in Rohanda if
  you intend to stay near the ridge.

  There is now a way in that does not involve walking. The Tribune reported a
  16 km road from Shala panchayat to the boundary of the temple premises,
  built under the Gohar block, part of it metalled and much of it still muddy.
  That road makes the lake reachable for elderly pilgrims and for people who
  cannot walk three hours uphill, which is a real gain. If you are able to
  walk, walk. The path is the older half of the visit.

  Walk slowly whichever way you come. This is a pilgrim path before it is a
  trek, and the etiquette of the path matters more than your pace.
faqs:
  - question: Where is Kamrunag Lake and how high is it?
    answer: >-
      Kamrunag lies on a ridge in Mandi district, Himachal Pradesh, reached
      most often from Rohanda on the Mandi to Karsog side. The Mandi district
      administration's tourism page gives the altitude as 3,334 m. A field
      botanist's account published in Hill Post in 2023 records about 2,900 m
      by GPS. The official district figure is the one we cite, but the
      difference is real and worth knowing before you quote a number.
  - question: How do you reach Kamrunag Lake, and is there a road now?
    answer: >-
      The traditional way is on foot from Rohanda, about 6 km of steep path
      and three to four hours according to the district page. Rohanda is
      roughly 47 km from Mandi town. The Tribune has also reported a 16 km
      road from Shala panchayat up to the boundary of the temple premises,
      built under the Gohar block, partly metalled and largely unsurfaced, so
      many people now drive most of the way. Road condition changes with
      season and weather; ask in Rohanda or Gohar before assuming it is open.
  - question: Why do people throw gold and money into Kamrunag Lake?
    answer: >-
      The Mandi district tourism page records a tradition of devotees offering
      gold, silver and coins to the lake when Dev Kamrunag fulfils a wish, and
      says the amount lying on the lake bed cannot be estimated. The Times of
      India's report from the fair describes offerings from all three days
      being collected and immersed in the water rather than banked. That is
      what published sources record. We have not yet heard the reasoning
      directly from the temple committee, so we do not explain the belief on
      their behalf.
  - question: Can anything be taken out of the lake?
    answer: >-
      No. Nothing offered to Kamrunag is meant to come back out. Devotees
      quoted by the Times of India said nobody dares remove the offerings and
      that no theft has ever been known there, which is why currency notes
      floating on the surface are an ordinary sight and not an invitation. Do
      not enter the water, do not reach into it, and do not treat what you can
      see as abandoned property. It is not.
  - question: When is the Saranahuli fair, and when is it quietest?
    answer: >-
      The Saranahuli fair falls in mid-June across the Kamrunag and Prashar
      areas. The Tribune describes deities from surrounding villages gathering
      at the temple premises with folk music and chanting, devotees performing
      parikrama of the lake, and Natti dancing. It is crowded, loud, and the
      fullest version of this place. If you want the ridge quiet instead, come
      in October. Confirm exact dates locally each year rather than trusting
      an old article.
  - question: Is the temple ever closed to visitors?
    answer: >-
      It can be. The lake has been closed for cleaning before. Hindustan Times
      reported in June 2014 that the Kamrunag lake would be cleaned from 29
      June to 3 July, and quoted temple official Vishnu Thakur saying that
      during that period there would be a bar on the entry of women and
      tourists to the temple premises. That is one dated report from 2014. We
      have not confirmed whether the same dates or the same restriction apply
      in any later year, and we are not presenting it as a standing rule. If
      you are travelling in late June or early July, ask the Kamrunag temple
      committee first.
  - question: How do I visit Kamrunag respectfully?
    answer: >-
      Carry every piece of your waste back down, including what you find. Do
      not enter the lake or take anything from it. Ask before photographing
      people, rituals or the inside of the temple, and do not fly a drone over
      a working shrine or a procession. Kahan Singh, president of the Kamrunag
      temple committee, told The Tribune that local shopkeepers have not been
      allowed to set up stalls on the temple premises, to maintain
      cleanliness, after visitor numbers rose. That rule falls on local people
      first. Do not undo it with a speaker and a picnic. If the committee's
      langar is running, eat only when offered and sit where you are shown.
  - question: What is the forest around the lake, and why does it matter?
    answer: >-
      It is a sacred grove with real ecological weight. A 2018 study in the
      Journal of Non-Timber Forest Products recorded 249 economically
      important plant species from 74 families and 168 genera in the Kamrunag
      sacred grove and its surroundings, 165 of them medicinal, including four
      species endemic to the Indian Himalayan region. The Tribune has reported
      that the HP State Biodiversity Board began the process of declaring the
      Kamrunag lake area a biodiversity heritage site. Stay on the path, do
      not collect plants, and do not light fires.
narrative: >-
  There is a bank in the mountains of Mandi that has never been robbed. Its
  vault is a lake.

  The climb from Rohanda is all deodar, the tall silence of a forest that has
  been holy longer than it has been mapped. We walked behind a family carrying
  sweets and a red cloth, and the grandmother set the pace, which is the
  correct pace.

  At the top, the water is dark and small and completely certain of itself.
  People come here to promise things to Dev Kamrunag and seal the promise with
  a coin thrown into the lake. Gold too, sometimes. The Mandi district
  administration's own tourism page records that tradition of offering gold,
  silver and coins on the fulfilment of a wish, and says the quantity at the
  bottom cannot be estimated. Nobody takes it out.

  I asked a shopkeeper at the tea stall why nobody dives for it. He didn't
  laugh. He just said, "Woh unka hai." It is his. The subject was closed,
  gently, the way you close a door on a sleeping child.

  That sentence is the entire economics of this lake. When the Times of India
  reported from the June 2015 fair, devotees described the same arrangement in
  plainer language: three days of offerings, notes and jewellery included,
  gathered up and immersed in the water rather than deposited anywhere.
  Devotees quoted in that report said they had never heard of a theft there,
  and that currency floating on the surface is an ordinary sight. We have not
  found any published measurement of the lake's depth.

  What has changed is the walking. For most of its history Kamrunag was earned
  on foot. The Tribune reported that a 16 km road was built from Shala
  panchayat up to the boundary of the temple premises under the Gohar block,
  an initiative of Raj Kumar, the former Shala gram panchayat pradhan and now
  its vice-pradhan, built with MGNREGA funds, part of it metalled and much of
  it still muddy. Kahan Singh, president of the Kamrunag temple committee,
  told the same paper that tourist numbers rose after the road came, that the
  committee began running a langar, a community kitchen, from 23 April, and
  that local shopkeepers had not been allowed to set up stalls on the temple
  premises in order to maintain cleanliness.

  Read that last part twice before you come. The reason the committee gave was
  cleanliness, and the rule falls on local shopkeepers first. A visitor who
  arrives with a speaker, a picnic and a bag of wrappers is undoing a rule the
  community applied to its own people before anyone applied it to guests.

  Local truth: make no promise here you do not intend to keep. Read from
  outside, the custom looks less like superstition and more like contract law,
  older than paper. That is our reading of it, not the temple's word for it.
  The second half of that law is the part nobody writes on a signboard. The
  water gives nothing back. Not a coin, not a photograph you were asked not to
  take, not a bottle left for someone else to carry down.

  The forest is not backdrop either. A 2018 study in the Journal of Non-Timber
  Forest Products recorded 249 economically important plant species from 74
  families and 168 genera in the Kamrunag sacred grove and its surroundings,
  165 of them medicinal, and four species endemic to the Indian Himalayan
  region. The district page calls the cover deodar; the field botanist writing
  in Hill Post described the stand around the lake as fir, spruce, yew, kail
  pine, brown oak and maple. Both descriptions are of the same walk from
  different eyes. The Himachal Pradesh State Biodiversity Board has since
  begun the process of declaring the Kamrunag lake area a biodiversity
  heritage site. Its project coordinator, Dr ML Thakur, told The Tribune that
  a meeting on it was held at Kandhi-Kamru panchayat with officers from the
  forest and revenue departments, biodiversity management committee members,
  gram panchayats, kardaars of Kamru-Nag and local knowledgeable persons. The
  2018 study already calls it a sacred grove. It carried that name long before
  a board took an interest in it.

  Come in mid-June and you will not be alone. The Tribune's account of the
  Saranahuli fair describes deities from surrounding villages gathering at the
  temple premises with folk music and chanting, devotees walking parikrama
  around the lake, and Natti danced on the ridge. That is the fullest version
  of this place and also the one in which a visitor is most easily in the way.
  The Times of India, reporting from the 2015 fair, noted that animal
  sacrifice had earlier been part of the three-day fair and did not take place
  that year, after the Himachal Pradesh High Court's ban. We have not asked
  anyone at Kamrunag what that change has meant, and it is not a visitor's
  subject to raise at the water's edge.

  October is the other answer. The same lake, the same stone idol, nobody's
  voice on the ridge but your own, and the Dhauladhar clean across the north.

  Practical respect looks like this. Carry your rubbish down, all of it,
  including what you find. Stay out of the water. Ask before photographing
  people, rituals or the temple interior, and leave the drone at home. If the
  langar is running, eat only when you are offered and sit where you are
  shown. If you are visiting in late June or early July, check with the temple
  committee first, because the premises have been closed for the lake's
  cleaning in the past.

  I threw no coin. I wasn't ready. The lake respected that, and so did I.
closingQuote: >-
  Promise gently. Water remembers more than we do.
