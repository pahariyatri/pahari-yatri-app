localTruth: >-
  The offerings here are not banked. The Times of India, reporting from the
  June 2015 fair, described notes, coins and jewellery collected over the
  three days of the fair being immersed in the lake itself rather than
  deposited anywhere, and quoted devotees who said they had never heard of a
  theft at the water. The second half of the local truth is newer. The Tribune
  has reported a 16 km road running almost to the temple boundary, so many
  people arriving today have not walked up. The road changed how people
  arrive. It does not change what is asked of you at the water.
