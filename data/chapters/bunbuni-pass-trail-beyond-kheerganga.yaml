localTruth: >-
  Bunbuni Pass is genuinely positioned by multiple sources as an
  offbeat alternative to Kheerganga, not a marketing label attached
  after the fact. Its lower foot traffic is a direct, checkable
  consequence of starting from Kalga rather than the main Barshaini
  trailhead, not an accident of remoteness alone.
