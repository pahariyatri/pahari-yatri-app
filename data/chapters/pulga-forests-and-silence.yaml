localTruth: >-
  Pulga's good phone and internet connectivity, unusual for a village
  this remote, is precisely why it has become a base for remote workers
  and long-stay travellers rather than a passing-through village like
  many of its neighbours. That connectivity is not a coincidence to
  romanticise; it is a practical, service-level fact that changes who
  ends up living there for weeks instead of days.
