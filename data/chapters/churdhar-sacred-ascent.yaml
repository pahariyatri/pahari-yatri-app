overview: >-
  Churdhar, at 3,647 m (11,965 ft), is the highest peak of the outer Himalaya,
  rising alone above Sirmaur district. Its summit belongs to Shirgul Maharaj,
  the great deity of this region, and the last stretch to his shrine climbs
  through a chaos of giant boulders that pilgrims have threaded for centuries.
  From the top, on a clear day, the whole wall of the Greater Himalaya stands
  to the north and the plains fall away south.

  The classic ascent from Nohradhar is a steady, honest climb through deodar
  and then high fir and rhododendron. It is a pilgrimage first and a trek
  second: you will share the path with barefoot devotees, and the mountain's
  rules are theirs. Fit beginners can do it; everyone should respect its
  weather, which turns fast.
duration: 2 Days / 1 Night
distance: ~9 km one way from Nohradhar (round trip ~18 km)
maxAltitude: 3,647 m / 11,965 ft
difficulty: Moderate
bestTime: May–June and September–November; closed under snow December–April
gettingThere: >-
  Nearest railhead and airport hub: Chandigarh, about 130 km. Drive via Solan
  and Rajgarh to Nohradhar, the main trailhead. The path is unmistakable in
  season, lined with resting points and small tea huts. A quieter approach
  exists from the Chaupal side for those who want solitude.
itinerary:
  - day: Day 1
    title: Nohradhar · Jamnala · Teesri camp
    detail: >-
      Climb through deodar forest, about 5–6 hours, to the meadows and
      shelters below the summit ridge. Sleep at the serai or campsite near
      Teesri; nights are cold even in June.
  - day: Day 2
    title: Boulder field · Shirgul temple · descend
    detail: >-
      Start before dawn, thread the boulder maze to the summit shrine, and
      give the view its hour. Descend all the way to Nohradhar by late
      afternoon.
faqs:
  - question: How hard is the boulder section?
    answer: >-
      It is scrambling, not climbing: hands out of pockets, eyes on your feet,
      no exposure that needs ropes. In rain or early-season snow it becomes
      genuinely tricky, which is one more reason to respect the season.
  - question: Are there places to eat on the trail?
    answer: >-
      In season, small dhabas operate at intervals and at the top; simple
      dal-rice and tea. Carry water and some food anyway, and carry every
      wrapper back down.
  - question: Why do pilgrims climb Churdhar barefoot?
    answer: >-
      Some walk it as a vow to Shirgul Maharaj: hardship offered as sincerity.
      No one expects it of a visitor, but understanding it changes how you
      climb, and how quietly you pass those who do.
narrative: >-
  The last hour to Shirgul Maharaj is a conversation with boulders, and the
  boulders have the better arguments.

  We had climbed all day from Nohradhar through deodar that smelled of rain
  and resin, passing tea huts where pilgrims in slippers overtook us without
  irony. At Teesri the forest thinned, the cold arrived, and the summit ridge
  showed itself: a giant's rubble field stacked against the sky.

  You do not walk that last stretch. You negotiate it, hands out, breath loud,
  while grandmothers in shawls pick lines through the rocks like water finding
  a way down.

  On top, at 3,647 metres, the highest point of the outer Himalaya, stands the
  shrine of Shirgul, and beside it a silence with actual weight. North, the
  Greater Himalaya runs wall after wall. South, the plains dissolve into haze,
  the whole ordinary world you came from, looking negotiable.

  A man from Sirmaur fed us churma from a steel box because we were there and
  he had it. That was the entire logic, and I have thought about it since more
  than I have thought about the view.

  Local truth: this is Shirgul's court before it is anyone's summit. Pilgrims
  walk it barefoot in vows; whatever you wear, arrive with that seriousness or
  stay below.

  May, June, or the clear weeks after monsoon. Sleep at the serai, start the
  boulders at first light, and turn back without shame if rain finds you in
  them.

  The mountain did not ask if I was strong. It asked if I was paying
  attention.
closingQuote: >-
  At the top of the boulders there is a shrine. Inside the effort, there was
  one too.
