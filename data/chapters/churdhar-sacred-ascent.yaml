title: Churdhar Sacred Ascent Trek
invitation: A long devotion across ridge and cloud.
excerpt: >-
  The trail carries temple bells and cedar breath. At the summit, the sky feels
  near enough to greet.
location: Sirmaur
image: /static/images/chapters/churdhar-sacred-ascent/image.avif
