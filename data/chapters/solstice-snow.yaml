title: Solstice Snow
district: manali
trackType: cultural
parentBook: winter
invitation: Fire speaks softly in long nights. Walk by its answer.
excerpt: >-
  A ridge-side winter wander with lanterns and breath-clouds. The mountain
  edits our words down to what matters.
location: Above Manali
