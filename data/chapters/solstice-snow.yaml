overview: >-
  Above Manali in deep winter, the world simplifies to woodsmoke, deodar
  shadow and snow. This chapter is the shortest-day season walked gently:
  Hadimba's cedar grove under fresh fall, the Old Manali lanes when the cafés
  are shut and the village returns to itself, and snowline walks toward Solang
  with the right gear underfoot.

  Winter here asks for humility more than fitness: short daylight, icy paths,
  sudden storms. In exchange it gives the Himalaya at its most honest, and hot
  food tastes the way it was always meant to.
duration: 2–3 days
distance: 2–8 km per walk
difficulty: Gentle, with winter care
bestTime: Mid-December–February; the solstice weeks for the longest nights
gettingThere: >-
  Manali by road (check pass and highway conditions after storms). Everything
  in this chapter is walked from town; microspikes and gaiters turn icy lanes
  from hazard into pleasure. Hire local for anything above the village
  snowline.
itinerary:
  - day: Movement I
    title: Cedar grove in snow
    detail: >-
      Hadimba's forest just after snowfall, early, before footprints. Twenty
      minutes of walking, an hour of standing still.
  - day: Movement II
    title: Snowline walk
    detail: >-
      Toward Solang or up the Lama Dugh path's first hour, turning back at the
      depth of your gear and daylight.
faqs:
  - question: Do I need special equipment?
    answer: >-
      Real winter boots, microspikes, layered wool or fleece, and gloves you
      can actually walk in. Nothing technical, but nothing optional either.
  - question: How cold does deep winter get here?
    answer: >-
      Nights sit between minus five and minus fifteen around the villages,
      colder with wind. It is a manageable, honest cold: dress in real layers
      and let the bukhari stove and the kitchen do the rest.
  - question: Is anything open in the off season?
    answer: >-
      Enough. A few cafés and homestays keep their fires lit, and the town's
      own life, wood-splitting, weddings, temple mornings, becomes the thing
      you came to see.
narrative: >-
  On the shortest day of the year, Manali smells of woodsmoke and oranges, and
  the tourists have mostly gone home, and the town quietly becomes itself.

  We walked into Hadimba's cedar grove the morning after snowfall, before any
  footprints but a crow's. The deodars carried their loads with the patience
  of elders holding sleeping children. Inside the temple's dark, the wood
  smelled six hundred years old, which it is.

  Old Manali's lanes, shuttered and white, gave us their off-season face: a
  man splitting wood in rhythm, steam from a kitchen window, a dog escorting
  us exactly to the edge of his jurisdiction.

  In the afternoon we took the snowline path toward Solang, microspikes
  biting, breath in flags, and turned back at the hour our daylight budget
  demanded. Winter's rule is simple: the mountain sets the terms and you say
  thank you.

  Evening was a bukhari stove, dal with local red rice, and our host
  explaining how the village once measured winter in wood stacks and weddings.
  The solstice night is long here. Nobody fights it. They feed it wood and
  stories.

  Local truth: winter is when Kullu's gods travel and villages hold their own
  festivals; ask your host what is happening, not the internet. The internet
  does not know.

  Mid-December to February. Real boots, real layers, short plans. Book a
  homestay with a stove, not a view; the view finds you anyway.

  The longest night of the year, and it was the first one in months I did not
  want to end.
closingQuote: >-
  Winter does not empty the mountains. It empties them of everything that was
  not mountain.
