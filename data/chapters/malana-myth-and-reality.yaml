localTruth: >-
  Two claims about Malana circulate constantly and deserve more care
  than most travel content gives them. The idea that Malana's residents
  descend from soldiers Alexander the Great left behind in 326 BCE is
  reported widely, but every credible account reporting it also says
  the claim is unproven, this chapter repeats that caveat rather than
  the legend alone. The description of Malana as "possibly the oldest
  democracy in the world" is a framing popular with travel writers, not
  a settled finding in political history, and is presented here as a
  claim some make, not as fact. Separately, Malana's real and
  well-documented cannabis economy, including its associated legal
  risk and social cost, is acknowledged here as a serious local reality
  rather than treated as a tourist curiosity or a reason to visit.
