localTruth: >-
  Chalal's exact altitude is reported loosely, "over 5300 feet" in the
  one detailed source found, rather than precisely surveyed, so this
  chapter states it as an approximate figure rather than a settled one.
  What is consistent across every account: no vehicle reaches the
  village, only a metal footbridge and a forest trail from Kasol.
