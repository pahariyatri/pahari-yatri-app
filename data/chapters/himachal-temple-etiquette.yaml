overview: >-
  Himachal temple etiquette is not one rulebook. Rules are set per deity, per
  temple committee and per valley, and a rule that holds at one shrine can be
  irrelevant at the next ridge. What travels everywhere is the method: watch
  before you act, ask before you assume, and treat the temple as a house you
  have been let into rather than a monument you have arrived at.

  This chapter covers what a first-time visitor actually needs — where footwear
  comes off, what not to touch, when photography is refused, what to wear, and
  what to do if a devta's palanquin meets you on a trail. Specific claims are
  hedged where they vary, and nothing here overrides what someone at the
  temple tells you.
faqs:
  - question: What should I wear to a temple in Himachal?
    answer: >-
      Shoulders and knees covered, for men and women. Skip shorts, very short
      dresses and sleeveless tops on a temple day. A plain shawl or large
      scarf is the most useful thing you can carry: it covers shoulders, it
      covers a head where head covering is expected, and it is warmth at
      3,000 metres. Some shrines have further requests — a covered head, no
      leather, occasionally more. If one applies, you will usually be told at
      the door. Being told is normal, not a telling-off.
  - question: Can I take photos inside a Himachal temple?
    answer: >-
      Assume no until someone says yes. Local accounts describe photography of
      the deity, the mohras (the metal faces mounted on the palanquin) and the
      inner sanctum being restricted at many devta temples; some restrict the
      whole precinct, some only the ritual. Signs exist in some places and not
      others, and the absence of a sign is not permission. Ask the pujari or
      the kardar in words, once. If a ritual is underway, put the phone away
      without waiting to be asked.
  - question: Can I touch the deity or the idol?
    answer: >-
      No, and the safer habit is to assume you may not touch anything at all —
      not the deity, not the palanquin, not the mohras, not the drums, not the
      offerings left by someone else. At many devta temples these are handled
      only by the pujari and the deity's office-holders — local accounts
      describe devotees not touching them either. Most visitors are also not
      expected to enter the sanctum; darshan is taken from the door.
  - question: What is a devta in Himachal?
    answer: >-
      A devta (or devi) is a local deity with a seat and a temple. The deity
      is represented at fairs and processions by a rath or palki, a palanquin
      carried by bearers. Around the deity are named roles: a pujari for
      ritual, a kardar who manages the deity's affairs, bajantris who play the
      deity's music, and in many places a gur, understood as the medium
      through whom the deity speaks. Local accounts describe many valleys
      where the devta also holds land and a working role in village life.
      These are held positions, not folklore staged for visitors. Terms and
      spellings differ by valley — Kullu, Mandi, Sirmaur and Chamba do not all
      use the same words.
  - question: What should I do if a devta's palanquin passes me on the trail?
    answer: >-
      Stop, step off the path, stand still, and let it go by. Do not walk
      through the procession, do not cut in front of the palki for a better
      photograph, do not try to overtake it on a narrow trail. Where the trail
      allows it, step to the hill side rather than the drop side — that is
      trail safety on a narrow path, not ritual. In a vehicle, pull over and
      wait. Standing quietly with your hands at your sides is generally
      understood; you are not expected to perform anything.
  - question: Do I have to remove my shoes, and where?
    answer: >-
      Yes, and usually further out than visitors expect. At some shrines the
      line is the outer gate, the courtyard edge or a marked stone rather than
      the sanctum door. The reliable signal is the shoes already there — stop
      where they stop. Socks are generally accepted on cold stone, but glance
      at what everyone else is doing.
  - question: What should I offer, and is there an entry fee?
    answer: >-
      Most village temples have no entry ticket. If you want to give
      something, use the donation box rather than putting money into anyone's
      hand, and keep the amount unremarkable. Do not use money to buy access
      to a place or a ritual you have been kept out of. If prasad is offered
      to you, accept it with your right hand and eat it; refusing outright
      reads badly — if you can't eat it, take it and say so.
  - question: Can I fly a drone over a temple or a fair?
    answer: >-
      Don't. Over a temple, a procession or a fair crowd it is intrusive in a
      way that is obvious to everyone below, and it turns a private moment
      into footage nobody agreed to. Separately, India's Drone Rules require
      registration and compliance with the DGCA airspace map, and a fair is
      exactly the kind of gathering where a drone gets you stopped.
narrative: >-
  In much of Himachal, the local deity is not a symbol. Local accounts
  describe villages consulting their devta before weddings, harvests and
  building work, and in some valleys before going to court. So when you step
  into a temple courtyard here, you are not entering a monument. You are
  entering somebody's house, during working hours, unannounced.

  This is the etiquette page that sits under our sacred chapters — Kamrunag,
  Shikari Devi, Churdhar, Parashar. It is general guidance for temples and
  devsthans, the seats of local deities, across Himachal. It cannot be a
  rulebook, and any page claiming to be one is overselling itself. Rules here
  are set per deity, per temple committee, per valley, and a rule that holds
  absolutely at one shrine may not exist at the next ridge. What travels
  everywhere is the method: watch, ask, wait. Nothing on this page overrides
  what a person at the temple tells you.

  Learn one word first: devta, or devi. Around the deity sit named roles — a
  pujari for ritual, a kardar who manages the deity's affairs and property,
  bajantris who play the deity's music, and in many places a gur, understood
  locally as the medium through whom the deity speaks. At fairs and
  processions the deity travels on a rath or palki, a palanquin carried on
  shoulders, often carrying mohras, metal faces of the deity. These are
  working positions held by real people. If you need permission for anything
  — a photograph, entry to an inner courtyard, attending a ritual — one of
  them is who you ask. Not the nearest shopkeeper, not your driver.

  Ethnographic work on Kullu and the western Himalaya describes disputes that
  could go to a court being brought to the deity first, with the answer
  carrying real social weight — land, debts, marriages, quarrels between
  families. Local accounts say the same. That is the local truth under all
  the etiquette below: you are not being asked to respect a belief you may
  not share. You are standing in front of an institution the village still
  answers to, and behaving accordingly costs you nothing.

  Start with your feet. Shoes come off earlier than most visitors expect. The
  reliable signal is the pile of chappals already there: stop where they
  stop. At some shrines that line is the outer gate or a marked stone rather
  than the sanctum door. Leather is refused at some shrines altogether, which
  catches people out at the belt, the wallet and the camera strap, so on a
  temple day a cloth belt and leaving the leather in the car saves an awkward
  conversation at the door.

  Then keep your hands to yourself. The safest assumption in a devta temple
  is that you may not touch anything: not the deity, not the palanquin, not
  the mohras, not the drums, not somebody else's offering. At many temples
  these are handled only by the pujari and the deity's office-holders — local
  accounts describe devotees not touching them either. Visitors take darshan
  from the door. Photography is the rule visitors worry about. Touching is
  the one we would be more careful with.

  On photography, the working assumption is no until someone says yes. Local
  accounts describe photography of the deity, the mohras and the sanctum
  being restricted at many devta temples; some restrict the entire precinct;
  some are relaxed about the building and firm about the ritual. Some post a
  sign. Many don't, and the absence of a sign is not permission. Ask once, in
  words, and accept the answer without negotiating. If a gur is present or a
  ritual is underway, put the phone away before anyone has to ask you. And
  leave the drone in the bag — over a temple, a procession or a fair it is
  intrusive in a way obvious to everyone standing underneath it.

  Dress plainly and cover shoulders and knees, men and women both. A shawl or
  a big scarf is the single most useful thing to carry: it covers shoulders,
  covers a head where head-covering is expected, and doubles as warmth at
  altitude, since many of the shrines in this book sit above 2,500 metres and
  make their own weather. Some temples have additional requests — a covered
  head, a removed upper garment, no leather. If one applies to you it will
  usually be said at the door. Being told is not a rebuke. It is how anyone,
  local or not, finds out.

  Sooner or later you will meet a deity on the road. A palki coming down a
  trail with drums behind it is not a photo opportunity that has arrived; it
  is traffic with right of way. Stop, step off the path, stand still, let it
  pass. Do not walk through the procession. Do not cut across in front of the
  palanquin to shoot it from the other side. Do not try to overtake it on a
  narrow section. Where the trail allows it, step to the hill side rather
  than the drop side — the bearers are carrying real weight on a bad surface
  and need the whole width; that is trail safety, not ritual. In a vehicle,
  pull over and wait. Standing quietly with your hands at your sides is
  generally understood; nobody expects a visitor to perform devotion they
  don't feel.

  The fairs are where all of this becomes visible, and also where it is most
  misread. Deities gather, drums run for hours, and the nati circles open in
  the ground. It looks like a festival anyone can join, and the hospitality
  is genuine enough that you will probably be fed by someone who has never
  met you. But the parts that look like performance mostly are not, and a
  crowd is not consent to film. Watch from the edge, which is where most
  people are standing anyway. If you are pulled into the circle, that is an
  invitation; don't manufacture one.

  A few practicalities. Alcohol, tobacco and non-vegetarian food are kept out
  of many temple precincts, and some deities' areas carry further
  prohibitions a visitor has no way of deducing — a particular food, a
  material, an animal product. This is the strongest argument for asking
  rather than guessing. Small village shrines often have no fixed hours and
  are opened by the pujari for morning and evening worship, so an afternoon
  arrival can find a locked door and nothing wrong with it. The deity may
  also simply be away: palanquins travel to fairs and to other deities, and
  local accounts describe a temple being effectively shut while its devta is
  in another valley. If your visit depends on a specific ritual or fair,
  confirm the date locally in the week before — these follow local calendars,
  not the Gregorian one.

  Offerings are simple. Use the donation box rather than handing money to
  anyone, keep the amount unremarkable, and never try to pay your way past a
  restriction. If prasad is put into your hands, take it with the right hand
  and eat it.

  If you remember nothing else, remember the two-minute rule. Stand still at
  the edge of the courtyard for two minutes before you do anything at all.
  Watch where the shoes stop, where people stop walking forward, who touches
  what, where the phones are and are not. Then copy the grandmother in front
  of you. She has done this ten thousand times and she is not going to get it
  wrong.
closingQuote: >-
  A temple in Himachal is not a monument you have arrived at. It is a house you
  have been let into.
