localTruth: >-
  In many Himachali valleys the devta is not a symbol but an institution — with
  named office-holders a village can point you to, and, local accounts and
  ethnographic work describe, a standing in village matters that people still
  accept. That is why temple etiquette here feels heavier than at a city
  temple. You are not being asked to respect a belief. You are standing in
  front of an institution the village still answers to.
