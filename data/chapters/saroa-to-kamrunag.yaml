title: Saroa to Kamrunag Lake
invitation: A ridge-walk that brings vows to a high keeper.
excerpt: >-
  From village slopes to a lake of oaths, the path feels like memory carried
  well.
location: Mandi District
image: /static/images/chapters/saroa-to-kamrunag/image.jpg
relatedStories:
  - ridge-to-vows
giftsFromMountains:
  - Integrity
  - Patience
themes:
  - Memory
  - Devotion
overview: >-
  This is the quieter, longer forest route to Kamrunag Lake, starting near
  Saroa off the Chail Chowk road in Mandi district. Instead of the busy
  pilgrim path from Rohanda, it follows shepherd trails along the ridge,
  through oak and deodar, arriving at the lake from its gentler shoulder at
  about 3,334 m.

  Walk it when you want the lake to arrive slowly. The forest here holds
  langur troops, whistling thrushes, and long stretches where the only sound
  is your own boots on leaf litter. It joins the same sacred ground as the
  main path, so the same etiquette applies at the water.
duration: 1 long day, or 2 easy days
distance: ~9 km one way (round trip ~18 km)
maxAltitude: 3,334 m / 10,938 ft
difficulty: Moderate
bestTime: April–June and September–November
gettingThere: >-
  Reach Mandi, then drive toward Chail Chowk and on to Saroa village (about
  1.5–2 hours). The trail leaves the road near the village and climbs through
  terraced fields into forest. A local walking companion is easy to arrange in
  Saroa and worth it: the path braids with cattle trails in places.
itinerary:
  - day: Day 1
    title: Saroa · ridge forest · Kamrunag
    detail: >-
      A steady 4–5 hour climb through oak and deodar to the lake bowl. Time
      your arrival for early afternoon, sit an hour with the temple, and
      either descend or stay near the ridge depending on your plan.
faqs:
  - question: Which route should I choose, Rohanda or Saroa?
    answer: >-
      Rohanda is shorter and livelier, the pilgrim's way. Saroa is longer,
      emptier, and more of a walker's forest day. If the June fair is on, take
      Rohanda for the spectacle or Saroa to avoid it.
