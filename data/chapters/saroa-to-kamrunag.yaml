overview: >-
  This is the quieter, longer forest route to Kamrunag Lake, starting near
  Saroa off the Chail Chowk road in Mandi district. Instead of the busy
  pilgrim path from Rohanda, it follows shepherd trails along the ridge,
  through oak and deodar, arriving at the lake from its gentler shoulder at
  about 3,334 m.

  Walk it when you want the lake to arrive slowly. The forest here holds
  langur troops, whistling thrushes, and long stretches where the only sound
  is your own boots on leaf litter. It joins the same sacred ground as the
  main path, so the same etiquette applies at the water.
duration: 1 long day, or 2 easy days
distance: ~9 km one way (round trip ~18 km)
maxAltitude: 3,334 m / 10,938 ft
difficulty: Moderate
bestTime: April–June and September–November
gettingThere: >-
  Reach Mandi, then drive toward Chail Chowk and on to Saroa village (about
  1.5–2 hours). The trail leaves the road near the village and climbs through
  terraced fields into forest. A local walking companion is easy to arrange in
  Saroa and worth it: the path braids with cattle trails in places.
itinerary:
  - day: Day 1
    title: Saroa · ridge forest · Kamrunag
    detail: >-
      A steady 4–5 hour climb through oak and deodar to the lake bowl. Time
      your arrival for early afternoon, sit an hour with the temple, and
      either descend or stay near the ridge depending on your plan.
faqs:
  - question: Which route should I choose, Rohanda or Saroa?
    answer: >-
      Rohanda is shorter and livelier, the pilgrim's way. Saroa is longer,
      emptier, and more of a walker's forest day. If the June fair is on, take
      Rohanda for the spectacle or Saroa to avoid it.
  - question: How demanding is the walk from Saroa?
    answer: >-
      A steady four to five hours uphill through forest, with no technical
      ground. Anyone who can walk a full morning at their own pace can do it;
      the path asks for attention more than athleticism.
  - question: When is this route closed?
    answer: >-
      Snow usually shuts the upper forest from December to March. May, June,
      and the weeks after the monsoon are the kind months.
narrative: >-
  There are two roads to a god: the busy one, and the one the forest keeps for
  itself.

  We took the second. From Saroa the path leaves the fields almost
  apologetically, slips between two houses, and then the oak closes over you
  like water over a stone.

  For four hours we met exactly three people: two shepherd brothers arguing
  pleasantly about a dog, and a woman carrying grass who asked if we had
  eaten. Not who we were. Whether we had eaten.

  The forest here does not perform. Langurs crash somewhere out of sight, a
  whistling thrush practises one phrase all morning, and the trail keeps
  braiding into cattle paths so that you must pay attention, which is the fee
  this route charges instead of crowds.

  When the lake finally appears through the trees, it arrives sideways,
  without announcement. After the long green tunnel, the open sky over the
  water feels almost too loud.

  Local truth: ask in Saroa for someone to walk with you. Not because it is
  dangerous, but because the path's stories live in people, not signboards,
  and a day's wage means something here.

  Go in May or October, start early, carry water, and let the Rohanda pilgrims
  have their route. This one is for walkers who like their temples to be
  earned slowly.

  The short way shows you the lake. The long way shows you why it matters.
closingQuote: >-
  Some paths are not shortcuts to a place, but the place itself.
