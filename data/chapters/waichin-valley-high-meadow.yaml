localTruth: >-
  Waichin Valley appears in far fewer sources than the villages
  elsewhere in this book, and this chapter reflects that honestly
  rather than inflating a thin research base into false confidence.
  What is documented consistently: the approach begins near the Malana
  Dam, and the trail runs through meadow and forest with a river
  alongside much of the route.
