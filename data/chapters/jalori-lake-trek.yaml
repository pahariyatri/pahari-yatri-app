title: Jalori Lake Trek
invitation: A circle of water tucked into quiet hills.
excerpt: >-
  Short and generous, the trail finds a lake that likes to listen.
location: Jalori Pass
image: /static/images/chapters/jalori-lake-trek/image.jpg
