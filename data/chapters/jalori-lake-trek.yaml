overview: >-
  From Jalori Pass (3,120 m) on the old Kullu–Shimla road, a nearly level
  forest path runs 5 km east to Serolsar Lake, a small dark-water lake ringed
  by kharsu oak and watched by the temple of Budhi Nagin, the old serpent
  goddess. Local belief says a bird called the aabi keeps the water spotless,
  lifting out every leaf that falls.

  This is the easiest true lake walk in the region, a gift of a day: an hour
  and a half of soft trail each way, tea huts at the pass, and one of
  Himachal's most companionable forests. It pairs beautifully with a stay in
  Jibhi or Shoja below the pass.
duration: Half to full day
distance: ~5 km one way from Jalori Pass (round trip ~10 km)
maxAltitude: 3,120 m / 10,236 ft at the pass
difficulty: Easy
bestTime: April–June and September–November; the pass closes in snow, roughly December–March
gettingThere: >-
  Reach Banjar via Aut (on the Delhi–Manali highway), then drive up through
  Jibhi and Shoja to Jalori Pass; the last kilometres are steep and narrow.
  Buses and shared taxis run from Banjar in season. The lake trail starts
  beside the pass temple and stays on the ridge the whole way.
itinerary:
  - day: One day
    title: Pass · forest ridge · Serolsar · return
    detail: >-
      Walk out along the oak ridge, 1.5 hours to the lake. Circle the water
      clockwise, greet Budhi Nagin's temple, and walk back for thukpa and tea
      at the pass. Add the short climb to Raghupur Fort meadow if the day is
      clear.
faqs:
  - question: Can beginners and children do this walk?
    answer: >-
      Yes: the path is broad, shaded, and nearly flat. The altitude is real,
      so walk gently and keep everyone warm; weather at the pass changes
      quickly.
  - question: Is there food and water on the way?
    answer: >-
      Dhabas at Jalori Pass serve simple hot food, and in high season a hut
      near the lake sometimes opens. Carry a filled bottle; do not wash
      anything in the lake.
  - question: What else can I walk from Jalori Pass?
    answer: >-
      The short climb to Raghupur fort meadow, about forty minutes, opens a
      360-degree grass dome that pairs beautifully with the lake walk.
      Together they make one unhurried, complete day.
narrative: >-
  A lake with its own housekeeper. That is what they told us at the pass, and
  we walked an hour and a half to check.

  From Jalori the path never really climbs. It rolls along a ridge of old
  kharsu oak, trees with bark like elephant skin, and the forest floor is so
  soft your footsteps stop sounding like arrivals.

  Serolsar, when it comes, is small, dark, and perfectly kept. Not one leaf on
  the surface. The story says a bird called the aabi lifts each leaf out the
  moment it falls, keeping the water clean for Budhi Nagin, the old serpent
  goddess whose temple sits at the shore like a patient grandmother.

  We watched for the bird. A leaf fell. I will not tell you what happened,
  because the not-knowing is doing good work in me still.

  A family from Ani was circling the lake with folded hands, and their small
  daughter ran the circle twice more for pleasure, which the goddess, I think,
  prefers.

  Chai at the pass afterwards, thick with sugar, while cloud came up the
  Shimla side like slow applause.

  Local truth: circle the water clockwise, keep your shoes on the path side,
  and do not throw anything in, not coins, not wishes. This lake's economy is
  leaves, and it is balanced.

  Any clear day April to November. Add the half-hour climb to Raghupur's fort
  meadow if the sky is honest. Take your wrappers home.

  Somewhere a bird keeps a whole lake clean, one leaf at a time. It felt less
  like a legend and more like an instruction.
closingQuote: >-
  Tend one small thing completely. The bird does not clean every lake. It
  cleans its lake.
