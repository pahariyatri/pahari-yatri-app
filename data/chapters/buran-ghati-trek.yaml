title: Buran Ghati Trek
invitation: A high pass that teaches courage with gentleness.
excerpt: >-
  Snow bridges and golden meadows, a clean line between seasons. We walk it with
  respect and return lighter.
location: Pabbar Valley to Kinnaur
image: /static/images/chapters/buran-ghati-trek/image.avif
relatedStories:
  - buran-first-light
giftsFromMountains:
  - Balance
  - Resolve
themes:
  - Transition
  - Bravery
overview: >-
  Buran Ghati (4,572 m / 15,000 ft) is the celebrated pass between the Pabbar
  valley of Shimla district and the Baspa valley of Kinnaur. The route gathers
  everything the western Himalaya does well: Janglik's timber village, the
  vast meadow of Dayara, the tarn at Chandernahan side valleys, a wall of snow
  at the pass, and then the long green descent to Barua village among Kinnauri
  orchards.

  The pass day includes a steep snow descent early in the season, often with a
  fixed rope for the first wall, which is what gives Buran its adventurous
  reputation. With a competent guide it is a safe, unforgettable crossing for
  fit trekkers ready for their first high pass.
duration: 6 Days / 5 Nights
distance: ~38 km, Janglik to Barua
maxAltitude: 4,572 m / 15,000 ft
difficulty: Moderate to Difficult
bestTime: Mid-May–June (big snow on the pass) and September–early October (clear and dry)
gettingThere: >-
  Start: Janglik, reached from Shimla via Rohru and Chirgaon (8–9 hours by
  road). Finish: Barua village in Kinnaur, from where the road drops to
  Karcham on the Hindustan–Tibet highway; exits run toward Shimla or onward to
  Sangla and Chitkul.
itinerary:
  - day: Day 1
    title: Janglik · Dayara
    detail: >-
      Through the village and forest to Dayara meadow, one of the largest high
      pastures in the region. First camp under a wide sky.
  - day: Day 2
    title: Dayara · Litham
    detail: >-
      Gentle walking past shepherd huts to Litham, facing the Chandernahan
      snow walls. Acclimatisation walk in the afternoon.
  - day: Day 3
    title: Litham · Dhunda
    detail: >-
      Climb to the stony camp at Dhunda (~4,000 m) below the pass. Cold night,
      early dinner, earlier sleep.
  - day: Day 4
    title: Buran Ghati · River camp
    detail: >-
      Pre-dawn start to the pass crest, prayer flags and the Baspa opening
      beyond. Descend the snow wall (rope-assisted early season) and long
      slopes to the river camp.
  - day: Day 5
    title: River camp · Barua
    detail: >-
      Walk down through forest into Barua's orchards and lanes: apples, wooden
      temples, and the first shops in a week.
  - day: Day 6
    title: Barua · road head · onward
    detail: >-
      Short walk to the road and drive out via Karcham. Keep this a buffer
      day: mountains do not read itineraries.
faqs:
  - question: Is Buran Ghati safe for a first high-altitude trek?
    answer: >-
      Yes, for fit walkers with a guided team: the route acclimatises well and
      the only technical moment, the pass wall, is short and managed with rope
      early in the season. By autumn the snow is mostly gone and it is a steep
      walk.
  - question: Which side should I start from?
    answer: >-
      Almost everyone starts from Janglik: the altitude builds gradually and
      the snow descent is taken downhill. Reversing it makes the pass day much
      harder.
