overview: >-
  Kheerganga (about 2,960 m) is the hot-spring meadow at the head of the
  Parvati valley. Local tradition ties it to Kartikeya, Shiva's son, though
  tellings of the story disagree on the details — this chapter treats it as
  living legend, not settled history. The classic path climbs from Barshaini
  past Nakthan village and the Rudranag falls; our variant loops via the
  quieter Buni Buni pass side, trading crowds for forest.

  Since July 2024, the Himachal Pradesh Forest Department has enforced a
  camping ban on the Kheerganga meadow, following a High Court directive
  after years of tents and waste damaging the site. This is now a day
  trek, not an overnight: the working rule is to arrive before 10 am and
  begin descending by 2 pm. Older overnight itineraries you may see
  elsewhere, including in this chapter's own narrative below, describe how
  the trek used to be walked, not what's currently permitted — check the
  latest local/forest-department notice before you plan around either
  version.
duration: 2 Days / 1 Night
distance: ~12 km one way from Barshaini (round trip ~24 km)
maxAltitude: ~2,960 m / 9,710 ft
difficulty: Easy to Moderate
bestTime: >-
  April–June and September–November for the climb; the trek now runs as a
  single day (arrive before 10 am, descend by 2 pm) under the current
  camping ban — see Practical Information above the FAQs for the source.
gettingThere: >-
  Reach Bhuntar (airport and highway junction), drive up the Parvati valley
  through Kasol and Manikaran to the road head at Barshaini. The trail is
  obvious and busy; the Buni Buni forest variant branches across the river and
  rejoins above Nakthan.
itinerary:
  - day: Day 1
    title: Barshaini · Nakthan · Kheerganga
    detail: >-
      Climb 4–6 hours through villages and pine forest, past the Rudranag
      shrine and the river confluence. Evening bath in the hot spring pool
      with the gorge going dark below.
  - day: Day 2
    title: Sunrise pool · descend
    detail: >-
      Early soak while frost still sits on the meadow, then walk down to
      Barshaini by early afternoon.
faqs:
  - question: Is Kheerganga too crowded now?
    answer: >-
      In high season, yes, the main path is busy. Walk on weekdays, start
      early, take the quieter western variant, and remember the meadow is
      sacred ground with a shrine, not a party lawn.
  - question: What are the hot spring rules?
    answer: >-
      Separate enclosures exist for men and women; soap is forbidden; keep
      voices low at dawn and dusk. The spring is an offering before it is an
      amenity.
  - question: Can I camp overnight at Kheerganga?
    answer: >-
      Not currently. The Himachal Pradesh Forest Department has banned
      overnight camping on the meadow since July 2024, following a High
      Court directive prompted by years of tent and waste damage. Treat it
      as a day trek: arrive before 10 am, bathe, and begin descending by 2
      pm. Rules do get revisited, so confirm the latest local notice before
      you go rather than relying on this page alone.
  - question: Is the Kartikeya story at Kheerganga historically true?
    answer: >-
      It's local tradition, not a historical record, and even within that
      tradition the details shift depending on who is telling it — some
      versions center on a quarrel with Ganesha, others on a round-the-world
      contest. Treat it as living legend that gives the place meaning, not as
      a dated event.
narrative: >-
  The reward for walking uphill for six hours in the Parvati valley is a bath
  the mountain has been heating for you since before you were born.

  We took the quiet side, the Buni Buni forest line, where the path smells of
  pine sap and the villages across the gorge look pinned to the slopes. At
  Rudranag the water twists past a small shrine, and porters rest under the
  tin roof, sharing beedis and route gossip.

  The last climb is honest work. And then the meadow: Kheerganga, wide and
  worn, prayer flags moving, steam rising from the spring pool like the
  mountain exhaling.

  One version of the story says Kartikeya came here after a falling-out with
  Ganesha and meditated so long that the spring began running white, like
  kheer. Ask three people and you may get three different tellings of who did
  what to whom — that disagreement is the honest state of the legend, not
  something to smooth over. What runs now is hot, mineral, and completely
  convincing regardless of which version you carry uphill. We lowered
  ourselves in at dusk with snow peaks going grey above, and the day's whole
  climb dissolved somewhere between the shoulders.

  Local truth: the pool is an offering before it is a hot tub. Separate
  bathing spaces, no soap, low voices at dawn. The meadow is under real
  pressure from its own fame; be the visitor the place would ask for.

  Come on weekdays, off season, April or late September. Carry your rubbish
  down; the mules already carry too much. The Buni Buni line up, main trail
  down is the best circle.

  I have taken a thousand baths in my life. I remember one.
closingQuote: >-
  The mountain gives hot water at the end of cold effort. It is not a spa. It
  is a sentence about how life works.
