overview: >-
  Kheerganga (about 2,960 m) is the hot-spring meadow at the head of the
  Parvati valley. Local tradition ties it to Kartikeya, Shiva's son, though
  tellings of the story disagree on the details — this chapter treats it as
  living legend, not settled history. The classic path climbs from Barshaini
  past Nakthan village and the Rudranag falls; our variant loops via the
  quieter Buni Buni pass side, trading crowds for forest.

  It is a friendly first Himalayan overnight: a steady half-day climb, a bath
  in the hot pool under cold peaks, and a walk back down the gorge. The
  valley's popularity is real, so this chapter is also a lesson in walking
  gently through a place under pressure.
duration: 2 Days / 1 Night
distance: ~12 km one way from Barshaini (round trip ~24 km)
maxAltitude: ~2,960 m / 9,710 ft
difficulty: Easy to Moderate
bestTime: April–June and September–November; the pools are best in cold air
gettingThere: >-
  Reach Bhuntar (airport and highway junction), drive up the Parvati valley
  through Kasol and Manikaran to the road head at Barshaini. The trail is
  obvious and busy; the Buni Buni forest variant branches across the river and
  rejoins above Nakthan.
