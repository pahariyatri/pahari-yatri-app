title: Kheer Ganga + Buni Buni Pass
invitation: Warm springs and a pass that asks gently.
excerpt: >-
  Forest ascents to a sacred pool, then onward to a humble ridge. A friendly
  chapter of Parvati valley.
location: Parvati Valley
image: /static/images/chapters/kheerganga-buni-buni-pass/image.jpg
