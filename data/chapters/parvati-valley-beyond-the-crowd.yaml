localTruth: >-
  Every village in this valley answers to a different rhythm than Kasol's.
  Kalga runs on apple-harvest time, Malana runs on a local council most
  visitors never see in session, Tosh runs on a backpacker season that has
  its own etiquette. Treating the whole valley like an extension of Kasol's
  cafe strip is the single fastest way to miss what any of them are actually
  about.
