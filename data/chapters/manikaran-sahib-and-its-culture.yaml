overview: >-
  Manikaran sits at about 1,760 metres in the Parvati valley, roughly 4
  kilometres past Kasol, built around natural hot springs that both
  Sikh and Hindu tradition claim as sacred, for different reasons.
  Sikh tradition holds that Guru Nanak Dev Ji, visiting with his
  companion Bhai Mardana in the early 16th century, revealed the hot
  spring when food was needed for the community, lifting a stone to
  release the heat that now powers the gurudwara's community kitchen.
  Hindu tradition ties the site to Shiva and Parvati, whose lost
  earring, Manikaran means jewelled earring, was recovered from the
  river by a serpent after Shiva's dance. Both traditions are held
  seriously at the site today, and the physical layout of gurudwara and
  temple sitting close together reflects a genuine, long-running
  coexistence rather than a modern gesture toward tolerance.
distance: ~4 km past Kasol on the Parvati valley road
bestTime: Year-round; the hot springs and langar operate regardless of season
gettingThere: >-
  Manikaran is on the same road that runs through Kasol, about 4
  kilometres further up the Parvati valley, accessible by the same
  buses and taxis that serve Kasol.
faqs:
  - question: Can anyone visit Manikaran Sahib, regardless of religion?
    answer: >-
      Yes. The gurudwara's langar, the free community kitchen, feeds
      everyone without asking about faith, and the hot springs and
      temple complex are open to all visitors who approach with
      respect.
  - question: Do the hot springs actually cure illness?
    answer: >-
      Some visitors and pilgrims believe the waters ease skin
      conditions or joint pain, and that belief is real and widely
      held. This chapter cannot verify it as medical fact, and presents
      it as belief, not treatment advice.
  - question: What is the significance of the name Manikaran?
    answer: >-
      It comes from the Hindu legend of Parvati's lost earring
      (manikaran means jewelled earring), recovered from the river
      after Shiva performed a dance in anger. This sits alongside, not
      above, the separate Sikh tradition tied to Guru Nanak.
narrative: >-
  Steam rises off the river at Manikaran the way it does nowhere else
  on this book's route, and the first thing most visitors notice is
  not the religious significance but the simple, strange fact of hot
  water running through a cold valley.

  The gurudwara's langar operates the way langars do everywhere, long
  steel tables, volunteers moving without hurry, dal served to whoever
  sits down regardless of what they believe. Walk a short distance and
  a Hindu temple holds its own version of why this place matters,
  Shiva and Parvati, a lost earring, a serpent sent to retrieve it.

  Neither tradition here treats the other as competition. They exist
  close enough to share a spring and have, by most accounts, for a very
  long time.

  Local truth: some pilgrims come specifically believing the hot
  springs will ease a physical ailment. This chapter holds that belief
  respectfully without presenting it as something the water is proven
  to do. Come for the langar, the springs, and the fact of two
  traditions occupying the same ground without needing to resolve which
  one is right.
closingQuote: >-
  Some places are sacred to one story. This one decided it did not need to choose.
