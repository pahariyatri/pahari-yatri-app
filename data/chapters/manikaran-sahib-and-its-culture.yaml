overview: >-
  Kullu district administration lists Manikaran at 1,829 metres and describes
  its hot springs and importance as a pilgrimage destination for Hindus and
  Sikhs.[1] The same account connects the place with an ancient legend
  involving Shiva and Parvati.[1] A Sikh devotional retelling associates
  Manikaran with Guru Nanak and Bhai Mardana; that account is presented here
  as religious tradition, not independently verified history.[2]
