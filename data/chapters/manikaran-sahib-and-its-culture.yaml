narrative: >-
  At Manikaran, heat rises from the ground beside the Parvati River. The
  district administration records the settlement's altitude as 1,829 metres
  and describes its hot springs as a reason pilgrims come here.[1] These are
  not background details: they are part of the place's physical identity and
  of the stories people bring to it.

  The district account connects Manikaran with a Hindu legend involving Shiva
  and Parvati.[1] Sikh devotional retellings associate the place with Guru
  Nanak and Bhai Mardana, including a story about a spring revealed when food
  was needed.[2] These accounts belong to distinct religious traditions.
  Neither should be flattened into a shared origin story, or mistaken for
  evidence that settles the sacred events as historical fact.

  A place can carry more than one pilgrimage history without those histories
  becoming interchangeable. What this chapter can establish is the documented
  geography and the district's description of Manikaran as significant to
  Hindu and Sikh pilgrims.[1] The detail of how each community understands
  that significance deserves careful, tradition-specific reporting.

  Manikaran follows Kasol in this book, but not as a stop on a prescribed
  itinerary. It opens another way of reading the valley: through the places
  that matter for reasons other than the routes that pass them.
closingQuote: >-
  The landscape is shared; the histories remain distinct.
