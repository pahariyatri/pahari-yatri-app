overview: >-
  On the skirts of Kinnaur, between the Sutlej gorge and the high villages,
  stand small shrines that the tourist economy never mapped: a cedar cell
  above a spring, a stone slab under prayer flags where two paths meet. This
  chapter is a slow walk to a few of them around Sarahan and the villages
  above the Jeori road, with Bhimakali's great tower temple as anchor and
  teacher.

  The practice is a footnote pilgrimage: visiting what is still worshipped but
  no longer noticed, learning to read a shrine's signs (fresh oil, tied
  threads, a swept threshold) before deciding whether your feet belong there
  at all.
duration: 2 days
distance: 3–8 km per walk
difficulty: Gentle to Moderate
bestTime: April–June and September–November
gettingThere: >-
  The Shimla–Kinnaur highway to Jeori, then the hill road up to Sarahan (about
  6–7 hours from Shimla). Bhimakali temple anchors the town; the walks climb
  from its lanes toward the forest shrines and spring temples above, on paths
  any local shopkeeper can point to.
itinerary:
  - day: Day 1
    title: Bhimakali and the town lanes
    detail: >-
      Learn the etiquette at the great temple first: it sets the grammar for
      every small shrine after. Evening walk to the bird park ridge for the
      Srikhand view.
  - day: Day 2
    title: The upper spring shrines
    detail: >-
      Morning climb through orchards to the smaller shrines above town; sit,
      read the signs, leave nothing but a coin where coins clearly go.
faqs:
  - question: Why 'forgotten' if people still worship there?
    answer: >-
      Forgotten by itineraries, not by villages. The word marks our ignorance,
      not their neglect, and the chapter exists to correct the first without
      disturbing the second.
  - question: How do I find the smaller shrines?
    answer: >-
      Not on maps: ask your homestay family or the shopkeeper below the
      temple. These are neighbours before they are places, and being walked to
      one by someone who tends it is the whole chapter in miniature.
  - question: May I photograph the shrines?
    answer: >-
      Courtyards usually yes, sanctums usually no, and always ask a person,
      not the air. The photograph you skip at a living shrine buys you
      something better: the welcome that follows restraint.
narrative: >-
  Above Sarahan there is a shrine the guidebooks skip: a cedar cell, a spring,
  a slab of stone under threads. Someone had swept it that morning. That is
  the whole story, and it undid me.

  We had come for Bhimakali, the great tower temple, silver doors, dragons on
  the eaves, a goddess whose court has run this hill for centuries. It teaches
  you the grammar: where to put your shoes, your hands, your eyes. Take that
  grammar and walk uphill.

  The paths above town thread through orchards to smaller and smaller gods. A
  spring with a brass face on the water pipe. A tree wearing a hundred faded
  threads, each one a wish still under warranty. At the cedar cell, fresh oil
  in the lamp cup, marigolds one day old.

  No priest, no signage, no queue. Just a maintained silence. Forgotten by
  itineraries, we realised, is not forgotten. Somebody climbs here on
  unremembered mornings and keeps the account open.

  An apple farmer found us sitting there and was pleased, not suspicious. This
  one, he said, is his family's to sweep. His grandfather's before. He did not
  know how old the shrine was. Age was not the point; continuity was.

  Local truth: read the signs before your feet decide. Fresh offerings mean
  live worship: stay to the edges, take nothing, add nothing but a coin where
  coins clearly gather. When in doubt, sit and be quiet; correct behaviour at
  a shrine is mostly the absence of behaviour.

  April to June, September to November, from a Sarahan base. Let Bhimakali
  teach you first; the small gods expect graduates.

  The great temples show you what faith built. The small ones show you what
  keeps it alive: one family, one broom, one morning at a time.
closingQuote: >-
  Nothing tended daily is ever forgotten, whatever the maps say.
