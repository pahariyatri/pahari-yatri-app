title: Forgotten Shrine
invitation: The small gods never left; they waited.
excerpt: >-
  A hillside shrine under cedar shade. Footnotes of a village still whisper in
  the stone.
location: Kinnaur skirts
image: /static/images/chapters/forgotten-shrine/image.jpg
relatedStories:
  - small-god
giftsFromMountains:
  - Reverence
  - Memory
themes:
  - Heritage
  - Listening
overview: >-
  On the skirts of Kinnaur, between the Sutlej gorge and the high villages,
  stand small shrines that the tourist economy never mapped: a cedar cell
  above a spring, a stone slab under prayer flags where two paths meet. This
  chapter is a slow walk to a few of them around Sarahan and the villages
  above the Jeori road, with Bhimakali's great tower temple as anchor and
  teacher.

  The practice is a footnote pilgrimage: visiting what is still worshipped but
  no longer noticed, learning to read a shrine's signs (fresh oil, tied
  threads, a swept threshold) before deciding whether your feet belong there
  at all.
duration: 2 days
distance: 3–8 km per walk
difficulty: Gentle to Moderate
bestTime: April–June and September–November
gettingThere: >-
  The Shimla–Kinnaur highway to Jeori, then the hill road up to Sarahan (about
  6–7 hours from Shimla). Bhimakali temple anchors the town; the walks climb
  from its lanes toward the forest shrines and spring temples above, on paths
  any local shopkeeper can point to.
itinerary:
  - day: Day 1
    title: Bhimakali and the town lanes
    detail: >-
      Learn the etiquette at the great temple first: it sets the grammar for
      every small shrine after. Evening walk to the bird park ridge for the
      Srikhand view.
  - day: Day 2
    title: The upper spring shrines
    detail: >-
      Morning climb through orchards to the smaller shrines above town; sit,
      read the signs, leave nothing but a coin where coins clearly go.
faqs:
  - question: Why 'forgotten' if people still worship there?
    answer: >-
      Forgotten by itineraries, not by villages. The word marks our ignorance,
      not their neglect, and the chapter exists to correct the first without
      disturbing the second.
