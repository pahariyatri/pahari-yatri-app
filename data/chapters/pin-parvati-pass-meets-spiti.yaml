narrative: >-
  On a map, a pass is a small interruption in a ridge. A finger crosses it
  without hesitation. A person cannot. Somewhere above the familiar village
  names, the easy motion of planning has to become something slower: a decision
  made with weather, ground and the rest of the team in view.


  Pin Parvati Pass links the upper Parvati side with the Pin Valley of Spiti. Mantalai belongs to its Parvati approach. Forest and inhabited valley give way to a journey where shelter, food and a safe retreat must be considered together. The change is not simply scenic. It changes what being prepared means.


  There is a written history worth reading carefully. In Himalayan Journal 41, Prabhat Kumar Ganguli records Louis Dane's crossing from Spiti in 1884 and a known Kullu-to-Spiti crossing led by H. Lee Shuttleworth in 1921. The account also acknowledges possible unrecorded local crossings. A name in an expedition record is evidence of that record, not proof that nobody knew the mountain before it entered an archive.


  That distinction leaves room for a fuller mountain story. Maps, published reports and organised expeditions are one strand. The knowledge of people who work along a route is another. This chapter does not invent a porter interview or turn a guide into an anonymous source of mountain wisdom. It asks the traveller to recognise skilled work, pay for it fairly and take its limits seriously.


  The mountaineering perspective is less interested in a heroic photograph than in the margin around it. Can the group turn around? Does everyone understand the plan? Is the person making a difficult decision free to say no? A successful journey can include a retreat. A booking date is a weak argument against a mountain that has changed since the booking was made.


  Indiahikes' documented account describes glaciated ground, hidden crevasses and difficult river crossings. This is terrain for experienced trekkers with an appropriately skilled expedition team, not an extension to improvise after Kheerganga. Previous success on Sar Pass does not establish readiness for this crossing. Nor is Pin Bhaba, another route into Spiti covered elsewhere in the library, an interchangeable name for it.


  For the traveller, the deeper experience may be the loss of small certainties: the ability to buy what was forgotten, to leave whenever one wants, or to assume a signal will make a difficult situation simple. A team replaces some of those certainties with preparation and trust. It cannot replace them with confidence alone.


  Discuss acclimatisation, current access requirements, technical competence, communications, evacuation arrangements and spare days before committing. Leave route decisions to conditions assessed on the ground; this chapter is a story and an orientation, not a navigation sheet. Carry all waste back, keep water sources clean and remember that the guide's responsibility extends to the whole team.


  Spiti should not become a prize that makes the intervening days disposable. The crossing matters because of the attention it demands along the way. When a map line finally becomes lived distance, arriving is only one part of what has happened.
gettingThere: Plan the whole expedition with an experienced operator, including
  the Parvati approach via Mantalai or the reverse journey from Spiti. Confirm
  permissions, acclimatisation, technical equipment, communications, retreat
  options and transport on both sides. Do not use this chapter for glacier
  navigation.
bestTime: A narrow, condition-dependent expedition window; obtain current advice
  rather than relying on a fixed calendar.
faqs:
  - question: Does Pin Parvati Pass connect Parvati Valley with Spiti?
    answer: Yes. It crosses the Kullu–Spiti divide between the upper Parvati and Pin
      valleys. Mantalai lies on the Parvati approach.
  - question: Is Pin Parvati Pass suitable for a first trek?
    answer: No. The documented route includes serious high-mountain terrain. It
      calls for prior altitude experience and a skilled expedition team.
  - question: Are Pin Parvati and Pin Bhaba the same pass?
    answer: No. They are different crossings with different approaches and demands,
      despite both being associated with Spiti.
  - question: Who first crossed Pin Parvati Pass?
    answer: Published expedition history records Louis Dane crossing from Spiti in
      1884, while acknowledging possible earlier unrecorded local journeys. It
      should not be called the first human crossing.
