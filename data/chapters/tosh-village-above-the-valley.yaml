localTruth: >-
  Tosh's cafes commonly serve Indian, Israeli and Tibetan food side by
  side on one menu, a real and checkable fact about the village's
  present-day tourism economy. That is different from saying Tosh's own
  festivals or architecture carry Tibetan cultural influence, a broader
  claim repeated on some travel sites that this chapter did not find
  independently confirmed. Serve one; hold the other.
