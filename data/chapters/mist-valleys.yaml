title: Mist Valleys
invitation: Drift and arrive. The path appears when you stop insisting.
excerpt: >-
  Valleys cupping cloud like a quiet potion. We walk slower and see more.
location: Great Himalayan National Park fringes
image: /static/images/chapters/mist-valleys/image.jpg
relatedStories:
  - quiet-compass
giftsFromMountains:
  - Attention
