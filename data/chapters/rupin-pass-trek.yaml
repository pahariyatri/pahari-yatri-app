overview: >-
  The Rupin Pass route (4,650 m / 15,255 ft) follows the Rupin river from
  Dhaula in Uttarakhand up into Himachal, ending in the Baspa valley at
  Sangla. It is famous for its staircase of surprises: hanging villages, the
  three-tiered Rupin waterfall, snow bridges over the river, and a final
  snowfield climb through the gully to the pass.

  This is a demanding, spectacular week. The trail gains altitude steadily and
  the pass day is long, but the route's drama, waterfall camps and the descent
  into Kinnaur's orchards repay every step. Best suited to trekkers with at
  least one high trek behind them.
duration: 7 Days / 6 Nights
distance: ~52 km, Dhaula to Sangla
maxAltitude: 4,650 m / 15,255 ft
difficulty: Difficult
bestTime: May–June and September–October
gettingThere: >-
  Start: Dhaula, reached from Dehradun via Purola and Mori along the Tons
  valley (8–10 hours). Finish: Sangla in the Baspa valley, connected by road
  to Shimla via Karcham. Plan a night in Sangla or Chitkul after the crossing;
  you will want it.
itinerary:
  - day: Day 1
    title: Dhaula · Sewa
    detail: >-
      Riverside walking to Sewa village and its unusual temple hung with
      wooden trophies.
  - day: Day 2
    title: Sewa · Jhaka
    detail: >-
      Cross into Himachal and climb to Jhaka, the 'hanging village' stitched
      to the hillside.
  - day: Day 3
    title: Jhaka · Saruwas Thach
    detail: >-
      Forest of pine and walnut, snow bridges over the Rupin, camp on the
      meadow.
  - day: Day 4
    title: Saruwas · Dhanderas Thach
    detail: >-
      Into the amphitheatre below the great waterfall; the river falls in
      three white steps ahead of camp.
  - day: Day 5
    title: Waterfall climb · Upper camp
    detail: >-
      Zigzag beside the falls to the upper snowfields (~4,100 m). Short day,
      big altitude; rest and hydrate.
  - day: Day 6
    title: Rupin Pass · Ronti Gad
    detail: >-
      The long day: snow gully to the pass gate, prayer flags, then a steep
      descent to meadows on the Kinnaur side.
  - day: Day 7
    title: Ronti Gad · Sangla
    detail: >-
      Descend past shepherd camps into Sangla, hot food and the Baspa's
      orchards.
faqs:
  - question: How does Rupin compare with Buran Ghati?
    answer: >-
      Rupin is longer, higher and more sustained; Buran is shorter with one
      dramatic snow wall. If this is your first pass, Buran is the kinder
      teacher; Rupin is the fuller pilgrimage.
  - question: Do I need crampons or ropes?
    answer: >-
      Microspikes are standard in early season and your team may fix a rope in
      the gully; there is no technical climbing. By late September it is
      mostly dry trail and scree.
  - question: How do I plan transport at both ends?
    answer: >-
      The trail starts at Dhaula (reached from Dehradun) and ends at Sangla in
      Kinnaur (road to Shimla). Treat the two ends as two different journeys
      and keep a buffer day after the crossing; the mountains do not read
      tickets.
narrative: >-
  There is a village on this route that hangs off the mountain like a shelf of
  books someone refuses to straighten. It is called Jhaka, and after it, the
  world tilts.

  The Rupin builds in staircases. River flats, then Jhaka's leaning lanes,
  then forests where snow bridges arc over the water and you cross them
  quickly, apologising.

  And then the amphitheatre: Dhanderas Thach, where the Rupin falls toward
  camp in three white storeys. We ate dinner facing it like an audience.
  Nobody said much. The waterfall was saying it.

  The climb beside the falls the next day is the trek's honest tax, zigzags
  with spray on the wind, and above it the world goes white and wide. Pass
  morning: a snow gully, steps kicked by those ahead, lungs doing arithmetic,
  and finally the gate at 4,650 metres where Kinnaur opens below like a green
  rumour.

  Coming down to Sangla two days later, the Baspa orchards smelled of cut
  grass and woodsmoke, and I ate the best rajma of my life, which had nothing
  to do with the recipe.

  Local truth: in Sewa village near the start, the temple is hung with wooden
  ladles and trophies, offerings from centuries of travellers who crossed
  before us. Sign the tradition with respect; we are one more line in a very
  old ledger.

  May–June for full snow theatre, September–October for stable weather. This
  one asks for training, a good team, and humility on the pass day. Give all
  three.

  Every staircase in that valley was built by water. We just borrowed the
  climb.
closingQuote: >-
  The waterfall does in one leap what we did in seven days. Neither of us was
  in a hurry, and that was the secret.
