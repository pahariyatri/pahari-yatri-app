title: Cloud Forest Paths
district: kullu
trackType: cultural
parentBook: monsoon
invitation: Walk under leaves tuned to rain; each drop keeps good time.
excerpt: >-
  The monsoon chapter drifts through fern and fog. Footsteps soften, and the
  heart measures distance in green.
location: Jibhi & Shoja cloud belt
