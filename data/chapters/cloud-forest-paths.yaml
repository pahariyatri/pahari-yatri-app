overview: >-
  Between Jibhi and Shoja, below Jalori Pass, the forest spends half the year
  inside cloud. Moss thickens on the north side of every trunk, waterfalls
  appear and disappear in the mist, and paths link timber villages, small
  falls and the fort meadow of Raghupur. This chapter is that cloud belt,
  walked slowly.

  There is no summit here. The practice is short walks repeated in different
  weather: the same path in rain, in shafted sun, in fog, until you know it
  the way locals do. Base yourself in a Jibhi or Shoja homestay and let the
  forest set the timetable.
duration: 2–4 unhurried days
distance: 2–8 km per walk
difficulty: Gentle
bestTime: March–June for flowers, July–September for full cloud-forest mood, October for clarity
gettingThere: >-
  Aut on the Delhi–Manali highway, then the Banjar road to Jibhi (about 1.5
  hours). Every walk in this chapter starts from a homestay door: the Jibhi
  waterfall lanes, the Chehni Kothi tower path from Shringa Rishi temple, and
  the forest track toward Shoja and the pass.
itinerary:
  - day: Movement I
    title: Jibhi waterfall lanes
    detail: >-
      The short mossy gorge walk above the village, best in morning mist. Take
      tea after, not before.
  - day: Movement II
    title: Chehni Kothi
    detail: >-
      Climb the old stone path to the tallest timber tower in the western
      Himalaya and sit with it a while; the village around it is not a museum.
  - day: Movement III
    title: Shoja to the pass forest
    detail: >-
      Walk the high road's forest shortcuts toward Jalori, turning back
      whenever the cloud closes. The turning back is part of the chapter.
faqs:
  - question: Is the monsoon a bad time for this chapter?
    answer: >-
      It is the truest time: this is a cloud forest. Bring proper rain layers,
      expect leeches on the wet paths, walk short distances, and you will see
      the place as it actually is.
