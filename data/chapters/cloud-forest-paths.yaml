overview: >-
  Between Jibhi and Shoja, below Jalori Pass, the forest spends half the year
  inside cloud. Moss thickens on the north side of every trunk, waterfalls
  appear and disappear in the mist, and paths link timber villages, small
  falls and the fort meadow of Raghupur. This chapter is that cloud belt,
  walked slowly.

  There is no summit here. The practice is short walks repeated in different
  weather: the same path in rain, in shafted sun, in fog, until you know it
  the way locals do. Base yourself in a Jibhi or Shoja homestay and let the
  forest set the timetable.
duration: 2–4 unhurried days
distance: 2–8 km per walk
difficulty: Gentle
bestTime: March–June for flowers, July–September for full cloud-forest mood, October for clarity
gettingThere: >-
  Aut on the Delhi–Manali highway, then the Banjar road to Jibhi (about 1.5
  hours). Every walk in this chapter starts from a homestay door: the Jibhi
  waterfall lanes, the Chehni Kothi tower path from Shringa Rishi temple, and
  the forest track toward Shoja and the pass.
itinerary:
  - day: Movement I
    title: Jibhi waterfall lanes
    detail: >-
      The short mossy gorge walk above the village, best in morning mist. Take
      tea after, not before.
  - day: Movement II
    title: Chehni Kothi
    detail: >-
      Climb the old stone path to the tallest timber tower in the western
      Himalaya and sit with it a while; the village around it is not a museum.
  - day: Movement III
    title: Shoja to the pass forest
    detail: >-
      Walk the high road's forest shortcuts toward Jalori, turning back
      whenever the cloud closes. The turning back is part of the chapter.
faqs:
  - question: Is the monsoon a bad time for this chapter?
    answer: >-
      It is the truest time: this is a cloud forest. Bring proper rain layers,
      expect leeches on the wet paths, walk short distances, and you will see
      the place as it actually is.
  - question: Are the leeches really that bad?
    answer: >-
      Only in the wet months, and they are a nuisance, not a danger: salt,
      full socks, and a sense of humour handle them. The drowned-green forest
      they guard is worth every one.
  - question: Has Jibhi become crowded?
    answer: >-
      Weekends bring cars to the main lane, yes. Walk twenty minutes up any
      forest path and you are alone with moss and water; the crowd rarely
      leaves the road.
narrative: >-
  In Jibhi the fog does not block the view. The fog is the view.

  We walked the same forest path three times in three weathers, and it was
  three different forests. In rain it smelled of iron and moss. In mist the
  deodars became rumours of trees. And in the one hour of sun, the whole slope
  steamed like bread out of an oven.

  The waterfall lanes above the village are short walks with long effects.
  Moss thickens on the north face of every trunk; streams appear, take a few
  steps with you, and leave without saying where.

  One morning we climbed the stone path to Chehni Kothi, the tower that has
  stood over its village for centuries, timber and stone laced together,
  leaning very slightly, like a tall relative listening. Children played
  cricket against its base. A god lives upstairs. Both facts were treated as
  normal, because both are.

  At the homestay, dinner was whatever the garden had agreed to that week, and
  the owner's mother inspected our wet socks with open disapproval and put
  them by the fire herself.

  Local truth: in cloud season, locals plan by the fog's schedule, not the
  clock's. Morning walks, afternoon fires. Adopt it and the weather stops
  being an obstacle and becomes the itinerary.

  July to September for the full drowned-green effect; leeches are the entry
  fee, salt is the ticket. March for flowers, October for clarity.

  I stopped waiting for the mist to lift. That was the day the valley decided
  I could stay.
closingQuote: >-
  Clouds are only mountains that learned to let go.
