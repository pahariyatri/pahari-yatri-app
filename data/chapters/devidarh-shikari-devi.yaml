title: Devidarh to Shikari Devi
invitation: A temple ridge in long light—steady and sincere.
excerpt: >-
  The day climbs gently to a sacred summit. Bells and wind keep company.
location: Mandi
image: /static/images/chapters/devidarh-shikari-devi/image.jpg
