title: Devidarh to Shikari Devi
parentBook: lost-trails
invitation: A temple ridge in long light—steady and sincere.
excerpt: >-
  The day climbs gently to a sacred summit. Bells and wind keep company.
location: Mandi
image: /static/images/chapters/devidarh-shikari-devi/image.jpg
giftsFromMountains:
  - Sincerity
  - Balance
themes:
  - Temple
  - Ridge
overview: >-
  Shikari Devi, at 3,359 m (11,020 ft), is the highest point of Mandi
  district, crowned by a temple that has no roof. Local belief says every
  attempt to roof the shrine has failed: the goddess of hunters prefers open
  sky. The summit meadow looks across half of Himachal, from the Dhauladhar to
  the Pir Panjal on a clear morning.

  The walk from Devidarh climbs through old-growth forest that is itself a
  sanctuary, part of the Shikari Devi Wildlife Sanctuary: monal pheasants,
  barking deer, black bear country. This chapter is a gentle two-day
  pilgrimage best done slowly, with a night near the top for the dawn.
duration: 2 Days / 1 Night
distance: ~12 km one way from Devidarh (round trip ~24 km)
maxAltitude: 3,359 m / 11,020 ft
difficulty: Moderate
bestTime: April–June and September–November; deep snow December–March
gettingThere: >-
  Reach Mandi town, then drive via Chail Chowk toward Janjehli; Devidarh sits
  about 60 km from Mandi. The trail leaves Devidarh through deodar forest and
  climbs the sanctuary ridge to the temple. An alternative, slightly longer
  approach starts from Janjehli (~18 km).
itinerary:
  - day: Day 1
    title: Devidarh · forest ridge · Shikari Devi
    detail: >-
      Climb 5–6 hours through deodar and kharsu oak, with the trail opening to
      meadows near the top. Reach the roofless temple by late afternoon; basic
      serais and dhabas near the summit shelter pilgrims in season.
  - day: Day 2
    title: Summit dawn · descend
    detail: >-
      Watch sunrise touch the open shrine, then descend to Devidarh by early
      afternoon. Knees appreciate walking poles on the way down.
faqs:
  - question: Why does the temple have no roof?
    answer: >-
      Every roof raised over the goddess is said to have fallen or burned. The
      shrine is left open to snow and sun, and that openness is the point: you
      stand where the goddess stands, under the same sky.
  - question: Is the trail safe for solo walkers?
    answer: >-
      The path is well used in season, but this is a wildlife sanctuary with
      bears in the forest. Walk with at least one companion, make gentle noise
      in thick sections, and never leave food out at night.
  - question: Can I stay overnight near the temple?
    answer: >-
      In season, simple serais and pilgrim shelters operate near the summit,
      and the dawn alone justifies the cold night. Carry warm layers even in
      June; the ridge makes its own weather.
narrative: >-
  Every roof they built for her fell down. So they stopped building roofs.

  That is the first thing you learn about Shikari Devi, and the last thing you
  understand. In between lies a day of forest so thick the light arrives
  green, and a ridge that keeps promising the top and then adding one more
  fold.

  We left Devidarh at dawn with parathas wrapped in newspaper. The sanctuary
  forest is bear country, so we talked and let our steps be heard, and the
  forest managed us politely, sending down monal calls like dropped coins.

  Near the summit the trees give up and the grass takes over, and then you see
  it: a stone shrine open to the whole sky, snow sitting inside the sanctum in
  winter, sun in summer, the goddess indifferent to weather in a way that
  reorganises your ideas about shelter.

  An old pujari shared his fire with us. He said hunters once prayed here
  before the hunt, and that the goddess accepts everyone the sky accepts,
  which is everyone.

  I stood where the roof should have been and felt oddly exposed, then oddly
  fine. Most of what I shelter myself from, I realised, is not weather.

  Local truth: the dawn view reaches from the Dhauladhar to the Kinnaur
  ranges, but locals climb for the darshan, not the panorama. Do both, in that
  order, and the mountain makes more sense.

  Go April to June or after the monsoon; sleep near the top if you can.
  Descend before afternoon cloud. Leave the shrine's silence the way you found
  it.

  She never needed a roof. It was we who needed her to have one.
closingQuote: >-
  Stand under the open sky long enough and you stop calling it exposure. You
  start calling it honesty.
