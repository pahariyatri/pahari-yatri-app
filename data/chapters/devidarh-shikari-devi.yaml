overview: >-
  Shikari Devi, at 3,359 m (11,020 ft), is the highest point of Mandi
  district, crowned by a temple that has no roof. Local belief says every
  attempt to roof the shrine has failed: the goddess of hunters prefers open
  sky. The summit meadow looks across half of Himachal, from the Dhauladhar to
  the Pir Panjal on a clear morning.

  The walk from Devidarh climbs through old-growth forest that is itself a
  sanctuary, part of the Shikari Devi Wildlife Sanctuary: monal pheasants,
  barking deer, black bear country. This chapter is a gentle two-day
  pilgrimage best done slowly, with a night near the top for the dawn.
duration: 2 Days / 1 Night
distance: ~12 km one way from Devidarh (round trip ~24 km)
maxAltitude: 3,359 m / 11,020 ft
difficulty: Moderate
bestTime: April–June and September–November; deep snow December–March
gettingThere: >-
  Reach Mandi town, then drive via Chail Chowk toward Janjehli; Devidarh sits
  about 60 km from Mandi. The trail leaves Devidarh through deodar forest and
  climbs the sanctuary ridge to the temple. An alternative, slightly longer
  approach starts from Janjehli (~18 km).
itinerary:
  - day: Day 1
    title: Devidarh · forest ridge · Shikari Devi
    detail: >-
      Climb 5–6 hours through deodar and kharsu oak, with the trail opening to
      meadows near the top. Reach the roofless temple by late afternoon; basic
      serais and dhabas near the summit shelter pilgrims in season.
  - day: Day 2
    title: Summit dawn · descend
    detail: >-
      Watch sunrise touch the open shrine, then descend to Devidarh by early
      afternoon. Knees appreciate walking poles on the way down.
faqs:
  - question: Why does the temple have no roof?
    answer: >-
      Every roof raised over the goddess is said to have fallen or burned. The
      shrine is left open to snow and sun, and that openness is the point: you
      stand where the goddess stands, under the same sky.
  - question: Is the trail safe for solo walkers?
    answer: >-
      The path is well used in season, but this is a wildlife sanctuary with
      bears in the forest. Walk with at least one companion, make gentle noise
      in thick sections, and never leave food out at night.
