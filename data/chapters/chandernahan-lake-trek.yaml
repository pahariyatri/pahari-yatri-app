title: Chandernahan Lake Trek
invitation: A lake that keeps winter’s precise memory.
excerpt: >-
  Snow basins and long light. The climb is patient; the view is a careful
  kindness.
location: Rohru region
image: /static/images/chapters/chandernahan-lake-trek/image.avif
relatedStories:
  - chandernahan-sky-notes
giftsFromMountains:
  - Stillness
  - Precision
themes:
  - Winter
  - Reflection
overview: >-
  Chandernahan (about 4,260 m / 13,976 ft) is a chain of glacial tarns high
  above the Pabbar valley in Rohru, Shimla district, and the source of the
  Pabbar river. The lakes are sacred to Devta Shikru, and shepherds have
  carried faith and flocks up this valley for generations. The trail runs from
  the last village, Janglik, through the great meadow at Litham, under snow
  walls that hold ice most of the year.

  This chapter is a proper Himalayan valley trek: river crossings, alpine
  camps, one strong summit-day push to the lakes and back. It rewards walkers
  who are comfortable with three or four days out and cold nights, without
  demanding technical skill.
duration: 4 Days / 3 Nights
distance: ~28 km round trip from Janglik
maxAltitude: 4,260 m / 13,976 ft
difficulty: Moderate to Difficult
bestTime: Mid-May–June and September–mid-October
gettingThere: >-
  From Shimla, drive via Theog and Rohru to Chirgaon, then up the rough road
  to Janglik (roughly 8–9 hours total). Janglik's timber homes are the last
  habitation; homestays here open and close with the season, so confirm before
  you travel.
itinerary:
  - day: Day 1
    title: Janglik · Dayara meadow
    detail: >-
      Climb out of the village through fields and forest to the shelf of
      Dayara, about 4–5 hours. Camp on the meadow edge with the valley falling
      away below.
  - day: Day 2
    title: Dayara · Litham
    detail: >-
      A shorter, beautiful day crossing streams to Litham meadow at the valley
      head, facing the snow line. Rest, hydrate, and walk light in the
      afternoon for acclimatisation.
  - day: Day 3
    title: Chandernahan lakes · return to Litham
    detail: >-
      The long day: climb the snow-fed gully to the tarns, 4,200 m and
      silence, then return to Litham camp. Start pre-dawn; turn back on time
      whatever the summit says.
  - day: Day 4
    title: Litham · Janglik
    detail: >-
      Walk out down the valley to Janglik and drive toward Rohru or Shimla.
faqs:
  - question: Do I need previous trek experience?
    answer: >-
      One prior multi-day trek helps. The altitude gain to the lakes is
      serious, and the lake day is long; fitness and patience matter more than
      technique.
  - question: Can the lakes be done as a day walk?
    answer: >-
      No. Janglik to the lakes and back is too far and too high for a single
      day for almost everyone. The meadows in between are the point anyway.
  - question: Can I walk this without a local team?
    answer: >-
      The valley is remote, the streams are cold, and the weather rewrites
      plans. Go with people from Janglik who read this ground for a living; it
      is safer, and the stories on the way are half the journey.
narrative: >-
  The river you drove along for hours is born in a bowl of snow, and you can
  walk to its cradle.

  Janglik is the last village, timber houses stacked like held breath, and
  past it the Pabbar valley opens into meadow after meadow until the word
  meadow stops meaning anything and you just walk inside green.

  At Litham camp the temperature fell with the sun and the snow walls at the
  valley head turned rose, then iron. A shepherd named Chatru shared his fire
  and said the lakes above are Devta Shikru's, and that his family has grazed
  under that god's eye for nine generations. Nine. I counted my own and got
  lost at three.

  Lake day started in the dark. The gully climbs beside old snow, breath
  rationed, until the first tarn appears, then another, black water in white
  stone, the actual first drops of the river that fills fields all the way to
  the plains.

  We stood at 4,260 metres where the Pabbar begins, and I understood for one
  clean moment that every river is somebody's child.

  Local truth: shepherds leave the lakes' edges undisturbed, no washing, no
  camping at the water. The source is a temple whose walls happen to be
  weather.

  Mid-May to June for snow drama, September for clarity. Take the
  acclimatisation seriously; turn around on time. The lakes have been there
  ten thousand years and will forgive your schedule.

  I drank one handful of the youngest water in the world, and said thank you
  to nobody in particular, which up there feels like somebody.
closingQuote: >-
  Walk far enough up any river and you arrive at a prayer.
