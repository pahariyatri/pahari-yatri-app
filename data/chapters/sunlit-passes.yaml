title: Sunlit Passes
invitation: Walk the warm edge of sky, where light loosens the old knots.
excerpt: >-
  A gentle traverse across summer ridgelines. Wild thyme underfoot, wind-bell
  horizons, and an easy laughter between peaks.
location: Kullu & Lahul ridges
image: /static/images/chapters/sunlit-passes/image.jpg
relatedStories:
  - sunlit-song
giftsFromMountains:
  - Warmth in the bones
  - Trust in the path
themes:
  - Light
  - Ease
overview: >-
  High summer on the Kullu–Lahaul divide: when Rohtang country opens, the
  ridgelines above 3,900 m become a traverse of light. This chapter collects
  the gentle crossings of that season, walks toward Bhrigu's grass shoulder
  and the Hampta approaches, where wild thyme crushes underfoot and the wind
  carries bells from flocks two valleys away.

  These are honest altitude days without glacier work: long, warm, bright,
  with big passes visible but not demanded. They are the summer heart of this
  library and the natural training ground for the harder crossings.
duration: 2–4 days
distance: 8–14 km per day
maxAltitude: up to ~4,000 m on the shoulders
difficulty: Moderate
bestTime: Mid-June–September
gettingThere: >-
  Manali. Road heads at Gulaba (for the Bhrigu shoulder), Jobri (for the
  Hampta approach) and Solang put every walk within an early-morning drive.
  Start at dawn: summer afternoons build cloud and the light you came for is a
  morning animal.
itinerary:
  - day: Movement I
    title: Gulaba to the grass shoulder
    detail: >-
      Climb from the road bend through birch to the open ridgeline toward
      Bhrigu, turning at the tarns or the weather.
  - day: Movement II
    title: Jobri river shelf
    detail: >-
      The Hampta approach walked as a day: river, boulders, and the pass
      framed ahead like a promise for another year.
faqs:
  - question: Can these walks replace a full pass trek?
    answer: >-
      They are complete in themselves: summit-day scenery without camp
      logistics. Many Yatris walk this chapter one year and cross Hampta or
      Buran the next; the mountains keep.
