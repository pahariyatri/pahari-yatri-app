overview: >-
  High summer on the Kullu–Lahaul divide: when Rohtang country opens, the
  ridgelines above 3,900 m become a traverse of light. This chapter collects
  the gentle crossings of that season, walks toward Bhrigu's grass shoulder
  and the Hampta approaches, where wild thyme crushes underfoot and the wind
  carries bells from flocks two valleys away.

  These are honest altitude days without glacier work: long, warm, bright,
  with big passes visible but not demanded. They are the summer heart of this
  library and the natural training ground for the harder crossings.
duration: 2–4 days
distance: 8–14 km per day
maxAltitude: up to ~4,000 m on the shoulders
difficulty: Moderate
bestTime: Mid-June–September
gettingThere: >-
  Manali. Road heads at Gulaba (for the Bhrigu shoulder), Jobri (for the
  Hampta approach) and Solang put every walk within an early-morning drive.
  Start at dawn: summer afternoons build cloud and the light you came for is a
  morning animal.
itinerary:
  - day: Movement I
    title: Gulaba to the grass shoulder
    detail: >-
      Climb from the road bend through birch to the open ridgeline toward
      Bhrigu, turning at the tarns or the weather.
  - day: Movement II
    title: Jobri river shelf
    detail: >-
      The Hampta approach walked as a day: river, boulders, and the pass
      framed ahead like a promise for another year.
faqs:
  - question: Can these walks replace a full pass trek?
    answer: >-
      They are complete in themselves: summit-day scenery without camp
      logistics. Many Yatris walk this chapter one year and cross Hampta or
      Buran the next; the mountains keep.
  - question: Can I walk these ridges alone?
    answer: >-
      The popular lines above Gulaba and Jobri see steady feet in season, and
      a dawn start keeps you inside the safe weather window. Beyond the known
      shoulders, take a companion; grass hides distance beautifully and
      cruelly.
  - question: How should I handle the altitude?
    answer: >-
      Drink constantly, climb slowly, and treat a headache as an instruction
      to descend, not a nuisance to push through. These shoulders touch 4,000
      metres; respect is the only technique required.
narrative: >-
  There is a season when the high ridges above Kullu stop being a wall and
  become a window, and the whole valley climbs through it.

  High summer. We left Gulaba at dawn, and by the time the sun cleared the
  eastern ridge we were in birch shadow, then above it, on grass shoulders
  that run toward Bhrigu with wild thyme crushing under every step, so the
  walk smells like a kitchen with good intentions.

  Flocks were everywhere, bells arriving on the wind two valleys before their
  sheep. At four thousand metres the ridgelines lay in rows to the horizon
  like the sea mid-swell, and the big passes, Hampta, Rohtang's crowds far
  away, stood open in the light, doors propped by the season.

  We ate lunch on a rock older than the concept of lunch. A raven audited us.
  Clouds started building at two, exactly as the chai-seller at Gulaba had
  predicted, and we were down before the sky finished its afternoon argument.

  Local truth: mountain summer runs on a morning economy. Every local start
  time seems brutally early until three p.m., when it is revealed as wisdom.
  The light you came for is a morning animal; the storms are afternoon ones.

  Mid-June to September. Honest fitness, sun cream, rain shell always. These
  shoulder-walks are complete journeys, not consolation prizes; the passes
  will still be there the year you want them.

  We went up for the views. What we brought down was the smell of thyme and
  the discipline of dawn.
closingQuote: >-
  Walk the warm edge of the sky once, and the old knots come loose on their
  own.
