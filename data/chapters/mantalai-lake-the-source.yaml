overview: >-
  Mantalai Lake sits at roughly 4,100 metres, fed by the Parvati
  glacier, and is the actual source of the Parvati river that gives
  this entire valley its name. Far beyond Kheerganga on the same
  general trekking axis, it marks the practical end of the Parvati
  valley trek network and the starting point for crossing the Pin
  Parvati Pass, at 5,319 metres, into the Pin Valley and Spiti beyond.
  Local and Hindu tradition holds that Shiva meditated at Mantalai for
  an immense span of time, some tellings say three thousand years,
  while Parvati rested downstream at what is now Manikaran, tying this
  remote alpine lake directly to the pilgrimage site much further down
  the same valley. A small Shiva temple with a shivling sits near the
  lake.
maxAltitude: ~4,100 m / 13,500 ft
bestTime: >-
  A narrow window in summer and early autumn only, given the altitude
  and the technical nature of continuing beyond it via Pin Parvati Pass
gettingThere: >-
  Reached by continuing well beyond Kheerganga on the same trekking
  axis, a serious multi-day undertaking requiring proper high-altitude
  preparation, not a casual extension of a Kheerganga day trip.
faqs:
  - question: Can I visit Mantalai Lake as an extension of a Kheerganga trip?
    answer: >-
      Not casually. Mantalai sits far beyond Kheerganga, at significant
      additional altitude and distance, and reaching it is a serious
      multi-day trek in its own right, not an add-on to a day visit.
  - question: Is Mantalai Lake connected to Manikaran?
    answer: >-
      Through tradition, yes. Local legend holds that Parvati rested at
      what is now Manikaran while Shiva meditated at Mantalai, linking
      this remote alpine source to the pilgrimage site much further
      down the valley.
  - question: What is the Pin Parvati Pass?
    answer: >-
      A high, technical pass at 5,319 metres reached from Mantalai
      Lake, crossing into the Pin Valley and Spiti. It is a serious
      mountaineering-adjacent undertaking, not a trek for casual
      visitors.
narrative: >-
  Every chapter in this book has, somewhere in it, a mention of the
  Parvati river, the water that names the whole valley and touches
  nearly every village in it. This is the one chapter about where that
  water actually begins.

  Mantalai sits far enough beyond Kheerganga that almost nobody who
  bathes in that hot spring continues on to see it. The lake itself is
  fed directly by glacier, cold in a way the springs downstream are
  not, and the small Shiva temple near its edge marks a spot local
  tradition treats with real seriousness.

  The legend here is specific: an incomprehensibly long meditation, a
  number, three thousand years, that this chapter takes as the
  legend's own way of describing scale rather than a historical claim.
  What is not legend is the geography. This water reaches Manikaran,
  reaches Kasol, reaches every village this book has described, before
  it reaches anywhere else.

  Local truth: this is not a Kheerganga add-on. Reaching Mantalai, and
  certainly continuing over Pin Parvati Pass, requires real
  high-altitude experience and proper support. Respect that distinction
  before planning around it.
closingQuote: >-
  Every story in this valley eventually traces back to water. This is where that water starts.
