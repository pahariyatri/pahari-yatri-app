overview: >-
  Mural Danda is a high grass ridge (around 3,600 m) above the Pabbar valley
  in Shimla district, a shepherd's balcony that looks straight across at the
  snow line from Hansbeshan to the Kinnaur ranges. The route climbs from
  villages near Sandasu through fir forest to a crest of open pasture that
  runs for kilometres.

  It is the meadow-walker's chapter of this book: no pass anxiety, no glacier,
  just sustained ridgeline grass, flocks, and horizon. Three easy days make it
  a fine first camp-trek, and photographers lose whole mornings up here.
duration: 3 Days / 2 Nights
distance: ~24 km round trip
maxAltitude: ~3,600 m / 11,800 ft
difficulty: Easy to Moderate
bestTime: April–June and September–November
gettingThere: >-
  From Shimla, drive via Theog and Rohru to Sandasu in the Pabbar valley (7–8
  hours). The trail climbs from the village through fields into forest; local
  guides in Sandasu know the water points on the ridge, which matter in dry
  autumn.
itinerary:
  - day: Day 1
    title: Sandasu · forest camp
    detail: >-
      Steady climb through deodar and fir to the first grass shelf, 4–5 hours.
      Camp at the forest edge.
  - day: Day 2
    title: The Danda ridge
    detail: >-
      Walk the open crest all day: small summits, shepherd huts, the Himalaya
      standing along the north. Camp high or return to the shelf.
  - day: Day 3
    title: Descend to Sandasu
    detail: >-
      Down through the forest by midday; drive toward Rohru or stay a night by
      the Pabbar.
faqs:
  - question: Why choose Mural Danda over better-known meadows?
    answer: >-
      Because almost nobody does. You get Ali-Bedni-grade ridgeline grass with
      a fraction of the footprints, and villages below that still treat
      walkers as guests rather than traffic.
