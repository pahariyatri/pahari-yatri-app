title: Shepherds’ Path
invitation: Follow the patient geometry of hooves and season.
excerpt: >-
  A long slant through pasture history. You learn the map that animals keep.
location: Chamba high pastures
image: /static/images/chapters/shepherds-path/image.jpg
relatedStories:
  - salt-and-song
giftsFromMountains:
  - Provision
  - Direction
themes:
  - Work
  - Grace
overview: >-
  Chamba's high pastures over the Ravi are the old economy of this library:
  Gaddi shepherds still move flocks up in June and down in October, along
  paths their grandfathers cut. This chapter walks a stretch of that world
  above Bharmour, the Gaddi capital, between the Chaurasi temples and the
  grazing shelves toward Kugti.

  Go to walk beside a working life, not to consume a view. Meals in shepherd
  huts, wool and weather talk, the Manimahesh peak standing over everything:
  the path teaches the pace, and the pace is the point.
duration: 3–4 days
distance: 6–12 km per day
maxAltitude: up to ~3,600 m on the grazing shelves
difficulty: Moderate
bestTime: June and September–early October, when the flocks are moving
gettingThere: >-
  Pathankot railhead, then the long beautiful road via Chamba town to Bharmour
  (7–8 hours). Walks begin from Bharmour toward Hadsar and the Kugti valley;
  local Gaddi guides are the chapter's real authors, and hiring one supports
  the path itself.
itinerary:
  - day: Day 1
    title: Bharmour and the Chaurasi
    detail: >-
      Arrive, walk the temple courtyard at dusk, and let the altitude settle.
  - day: Day 2
    title: Toward Hadsar and the grazing shelves
    detail: >-
      Follow the Budhil river path and climb to the first pastures; eat where
      the shepherds eat.
  - day: Day 3
    title: High grass day
    detail: >-
      A shelf-to-shelf walking day among flocks, returning to a hut or village
      night.
faqs:
  - question: Is this the Manimahesh yatra?
    answer: >-
      No, though it shares country with it. The Manimahesh pilgrimage runs to
      the sacred lake in Bhadon (Aug–Sep) and is its own vast event; this
      chapter walks the shepherd economy around Bharmour at quieter times.
