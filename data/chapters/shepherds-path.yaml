title: Shepherds’ Path
invitation: Follow the patient geometry of hooves and season.
excerpt: >-
  A long slant through pasture history. You learn the map that animals keep.
location: Chamba high pastures
image: /static/images/chapters/shepherds-path/image.jpg
relatedStories:
  - salt-and-song
giftsFromMountains:
  - Provision
  - Direction
themes:
  - Work
  - Grace
overview: >-
  Chamba's high pastures over the Ravi are the old economy of this library:
  Gaddi shepherds still move flocks up in June and down in October, along
  paths their grandfathers cut. This chapter walks a stretch of that world
  above Bharmour, the Gaddi capital, between the Chaurasi temples and the
  grazing shelves toward Kugti.

  Go to walk beside a working life, not to consume a view. Meals in shepherd
  huts, wool and weather talk, the Manimahesh peak standing over everything:
  the path teaches the pace, and the pace is the point.
duration: 3–4 days
distance: 6–12 km per day
maxAltitude: up to ~3,600 m on the grazing shelves
difficulty: Moderate
bestTime: June and September–early October, when the flocks are moving
gettingThere: >-
  Pathankot railhead, then the long beautiful road via Chamba town to Bharmour
  (7–8 hours). Walks begin from Bharmour toward Hadsar and the Kugti valley;
  local Gaddi guides are the chapter's real authors, and hiring one supports
  the path itself.
itinerary:
  - day: Day 1
    title: Bharmour and the Chaurasi
    detail: >-
      Arrive, walk the temple courtyard at dusk, and let the altitude settle.
  - day: Day 2
    title: Toward Hadsar and the grazing shelves
    detail: >-
      Follow the Budhil river path and climb to the first pastures; eat where
      the shepherds eat.
  - day: Day 3
    title: High grass day
    detail: >-
      A shelf-to-shelf walking day among flocks, returning to a hut or village
      night.
faqs:
  - question: Is this the Manimahesh yatra?
    answer: >-
      No, though it shares country with it. The Manimahesh pilgrimage runs to
      the sacred lake in Bhadon (Aug–Sep) and is its own vast event; this
      chapter walks the shepherd economy around Bharmour at quieter times.
  - question: What should I carry for hut hospitality?
    answer: >-
      Small useful gifts: good tea, jaggery, matches. Money for a shared meal
      can offend where a packet of tea honours. Your guide will know each
      household's grammar; follow it.
  - question: Is this route open to everyone?
    answer: >-
      Yes. Bharmour's homestays host all travellers, and Gaddi hospitality is
      famously wide. Bring mountain sense, honest fitness for long ups, and
      the patience to walk at wool's pace.
narrative: >-
  The GPS said we were nowhere. The shepherd said we were twenty minutes from
  tea. The shepherd was right, and that is the whole education of Chamba.

  Bharmour first: the Chaurasi temple courtyard at dusk, eighty-four shrines
  standing together like a stone congregation, children weaving between them,
  Manimahesh Kailash burning rose-gold above the rooflines.

  Then up. The Gaddi paths above the Budhil river are not marked because they
  are known, an entire library kept in legs and dogs and grandfather's
  instructions. We walked with Prem, whose flock moves like poured wool, and
  learned the day's grammar: leave when the frost softens, rest where the
  water is sweet, arrive before the cloud does.

  Lunch in a stone hut was rajma from one pot and a slab of fresh churi, and
  the talk was of snow dates and lamb prices and a leopard that had been
  reviewed unfavourably.

  On the high shelves the flocks spread across grass their families have
  grazed for centuries, under Kailash, which watches everything here like a
  landlord and a god, being both.

  Local truth: hiring a Gaddi guide is not a service transaction. It is the
  only door into this world, and it keeps the path itself alive; the day the
  walking economy dies, the paths close like books.

  June or September, when flocks are moving. Fitness enough for long ups.
  Bring small gifts of tea or tobacco, not money, for hut hospitality; and
  take nothing but instruction.

  We call it trekking and buy equipment. They call it Tuesday and bring dogs.
closingQuote: >-
  A path is a story the land tells to feet that keep listening.
