overview: >-
  An opening chapter on Parvati Valley in Kullu district. It considers
  Kasol's documented role in the region's modern tourism story, the
  pilgrimage context of Manikaran, and the distinct places gathered in
  this book. It separates published reporting from editorial
  interpretation and does not claim first-hand reporting.
faqs:
  - question: Is Kasol the same thing as the Parvati Valley?
    answer: >-
      No. This book treats Kasol as one place within the wider valley,
      not as a synonym for it. The Kullu district administration names
      Parvati Valley among the district's landscapes.[1]
  - question: What role does Kasol have in this book?
    answer: >-
      It is a place with its own tourism history and the subject of the
      next chapter. Published reporting describes how tourism shaped
      local businesses and records residents' views on its pressures.[2]
  - question: What does Manikaran add to this opening?
    answer: >-
      It gives the book a distinct pilgrimage context. The district
      administration describes Manikaran's hot springs and its
      significance for Hindu and Sikh pilgrims.[3]
narrative: >-
  A valley is easy to shrink to the name most people recognise.

  In travel writing, that name is often Kasol.[2] The Kullu district
  administration names Parvati Valley among the district's defining
  landscapes, but its public overview does not define the valley's
  boundaries or tell the stories of the places within it.[1]

  Kasol has its own tourism history. A 2026 ground report by ThePrint
  traces the Israeli connection to the late 1970s and 1980s and
  describes tourism's influence on cafes, lodging
  and other local businesses.[2] The report also records residents'
  concerns about the pressures that have accompanied tourism's growth.
  It is one account of a changing town, not a complete history or a
  single explanation for the valley.

  The distinction matters as the frame widens. The chapters gathered
  here move among settlements, pilgrimage places and mountain routes.
  Their inclusion does not make them one continuous itinerary or one
  shared experience.

  Manikaran offers a different point of orientation. The Kullu
  district's visitor information describes its hot springs and
  identifies it as a pilgrimage destination for Hindus and Sikhs.[3]
  Manikaran belongs in this book as a pilgrimage destination in its
  own right, not merely as a brief stop on the way to somewhere else.

  The next chapter turns to Kasol itself: how did this town become the
  region's best-known tourism reference point? The answer begins with
  Kasol's own history, before the book follows the names beyond it.
editorialNotes:
  - title: A Note on This Book
    body: >-
      This chapter draws on district-government information and
      published reporting; it does not claim a first-hand visit or
      interview. In the chapters that follow, documented claims,
      local traditions and editorial interpretation should remain
      distinct. Practical details require current verification.
