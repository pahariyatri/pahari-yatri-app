title: Why Locals Avoid Manali in Peak Season
excerpt: >-
  When the temperature in Delhi hits 45°C, the soul of Manali begins to
  suffocate under a sea of white number plates and honking horns.
parentRegion: himachal
image: /static/images/stories/manali-peak-season/image.jpg
quote: >-
